  ${decisions.map(r => `<div class="mini-item"><strong>${esc(r.question)}</strong><small>${esc(r.authority)} · Due ${esc(r.due)}</small></div>`).join('')}
  <p class="hint">${decisions.length} pending decisions · ${risks.length} open RAID records</p></div></section></div>
  <section class="panel"><h2>Manage delivery</h2><div class="toolbar">${['intake','charter','dependencies','raid','financials','quality','release','operations','reports','closure'].map(id => btn(esc(mMap[id].name),'goto:'+id)).join('')}</div></section>`;

function liveProgramOverview() {
  const active = activeWorkspace();
  if (!active?.program) return '<section class="panel"><h2>Program overview</h2><p>Create a program initiative to track delivery across related workspaces.</p></section>';
  const members = readLiveIndex().filter(r => r.program === active.program).map(r => ({...r, workspace: loadWorkspace(r.id)})).filter(r => r.workspace);
  return `<section class="panel"><h2>${esc(active.program)}</h2><p>${members.length} initiatives</p><div class="table-wrap"><table><thead><tr><th>Initiative</th><th>Owner</th><th>Stage</th><th>Forecast</th><th>Health</th><th>At-risk dependencies</th></tr></thead><tbody>${members.map(r => {
    const summary = deliverySnapshot(r.workspace);
    return `<tr><td>${btn(esc(r.workspace.metadata.case),'workspace:'+r.id)}</td><td>${esc(r.owner)}</td><td>${esc(summary.stage)}</td><td>${esc(summary.forecast)}</td><td>${status(summary.health)}</td><td>${summary.late.length}</td></tr>`;
  }).join('')}</tbody></table></div></section>`;
}
function liveReportDraft() {
  const {health, stage, forecast, late, decisions, risks} = deliverySnapshot(state);
  const fin = budgetBreakdown();
  return {period: state.metadata.asOfDate, overall: health === 'Not assessed' || health === 'Closed' ? '' : health,
    schedule: late.length || dateVal(forecast) > dateVal(state.metadata.targetRelease) ? 'Amber' : '',

    narrative: `${stage}. Forecast through ${forecast}. ${late.length} at-risk dependencies and ${risks.length} open RAID records. EAC ${money(fin.eac)} against ${money(fin.budget)} authorized.`,
    decisionNeeded: decisions.map(r => r.question).filter(Boolean).join('; ')};
}

const CHAT_SHORT_ANSWERS={
 'Who approves portfolio demand?':'The portfolio or delegated investment authority decides whether an idea enters discovery or receives funding. The sponsor brings the business need; the PM presents delivery and capacity implications.',
 'What is a measurable benefit?':'A benefit has a current baseline, a target, a method of measuring actual results, a review date and a business owner. Example: the proportion of eligible vehicle changes completed online without agent assistance.',
 'Who owns benefits?':'The business outcome owner or sponsor is accountable for benefit realization. Product and analytics teams measure the results; PM/program leadership makes sure the review is scheduled and evidence is available.',
 'Who owns the backlog?':'The Product Owner is accountable for ordering and communicating the Product Backlog. Developers determine how to implement work; the PM does not take over that ownership.',
 'Explain RACI':'RACI identifies who is Responsible for doing a task, Accountable for its outcome, Consulted for input and Informed of the result. For major decisions also record the named funding, business-risk or release approver; RACI alone can leave approval authority unclear.',
 'How does a PM use this register?':'Use the epic and feature register to understand scope and cross-team dependencies, compare completed increments to release commitments and identify risks. The Product Owner and Scrum team manage the detailed backlog and implementation.',
 'When should I escalate?':'Escalate if the issue cannot be resolved within agreed team/project authority, affects another initiative, crosses approved tolerances or needs a sponsor/portfolio decision. Provide evidence, forecast impact, options and a decision-by date.',
 'What is double counting?':'Double counting is reserving or charging the same capacity or cost more than once. Example: QA time already allocated to the enterprise IAM rollout must not also be treated as fully available to the portal project; contracted future costs already included in ETC must not be added to EAC again.',
 'When do I escalate RAID?':'Escalate when a high-impact risk or current issue exceeds the assigned owner’s authority or tolerance, threatens another milestone/project, or needs funding or a business decision. Keep the risk/issue record current and assign actions.',
 'How do I assess impact?':'Compare the proposed change against approved scope, target benefits, architecture, integrations, QA, security, budget and milestone forecast. Request estimates from responsible leads and identify the decision authority before accepting a material change.',
 'Who makes a decision?':'The named authority for that decision decides—not whoever happens to run the status meeting. Product Owner: backlog sequencing; sponsor/financial delegation: funding; technical authority: architecture; release authority: Go/No-Go.',
 'How do I escalate?':'Describe the issue, how it affects a milestone, cost, compliance or another project, what has already been tried, feasible options, your recommendation and the date a decision is needed. Send it to the correct authority and log the outcome.',
 'What should a decision log contain?':'A decision log needs the exact question, context, options and tradeoffs, recommendation, accountable approver, decision-by date, outcome/date and references to affected plans or risks.',
 'Who owns incidents?':'The service owner and the nominated incident commander lead live incidents under the operating model. Technical responders resolve defects; the PM coordinates outstanding project-side work and communications where relevant.',
 'How do I escalate a vendor delay?':'Verify what the supplier promised, contractual milestone and new forecast; assess downstream impact and recovery options with the vendor lead. Use procurement/vendor management and program governance for conflicts beyond the project’s authority.',
 'Who manages contracts?':'Procurement, vendor management and authorized commercial owners manage contractual commitments and changes. The Project Manager tracks delivery obligations, risk, forecast and escalation but does not automatically amend contracts.',
 'What evidence do I need?':'For an external deliverable, retain the agreed specification, commitment and owner, delivery or test evidence, acceptance result, impact of a missed date and documented escalation or revised agreement.',
 'Who accepts compliance risk?':'The designated business, security, privacy or compliance risk owner accepts residual risk within delegated policy. A PM coordinates evidence and escalation; they cannot waive legal or security requirements merely to protect a release date.',
 'Can a PM waive security findings?':'Not without explicit delegated authority—and critical regulatory or control restrictions may not be waivable. The PM documents findings, impact, remediation options and seeks the formal control-owner decision.',
 'When do I rebaseline?':'Rebaseline only when authorized governance accepts a material change to scope, delivery date or funding. First assess the cause and recovery choices; preserve the original baseline and change history.',
 'What are recovery options?':'Options include resequencing work, targeting a specific skill constraint, removing or phasing lower-priority scope, accepting a revised delivery date or pausing an unjustified investment. Compare cost, risk and benefit before recommending one.',
 'Who decides portfolio priority?':'Portfolio/business leadership allocates funding and capacity against strategy and guardrails, informed by value, urgency, risk and relative size. The PM provides evidence of delivery impact and competing commitments.',
 'How do I measure adoption?':'Agree the intended behavior change with the business owner, establish a baseline, then track indicators such as eligible transactions completed through self-service, staff training completion, exception rates and customer support volume.',
 'What if managers resist?':'Understand why they resist: capacity, decision rights, service continuity or incentives. Map impacts, involve functional leaders early, agree a staged pilot, train affected teams and measure whether the new approach improves outcomes.',
 'Who signs off closure?':'The sponsor or delegated project-closure authority approves formal closure when deliverables are accepted, financial and contract obligations reconciled, outstanding issues transferred and operational ownership confirmed.',
 'When is a project complete?':'Completion requires agreed deliverable acceptance, release or handoff where in scope, closure of project obligations and named owners for open actions and benefit measurement. Code complete alone is not project complete.',
 'How should I practice scenarios?':'Choose a scenario, state the facts you would verify, identify decision rights, propose options with schedule/cost/quality tradeoffs, and compare against the guidance. Revisit the linked register to see what evidence you would need.',
 'What makes an escalation effective?':'It is timely, evidence-based, addressed to the right authority and specific: impact, attempted resolution, options, recommendation, action owner and decision deadline. Avoid blame-only escalation.',
 'How is project recovery handled?':'Assess the integrated current state before changing commitments; identify bottlenecks, critical path, funding to finish and release controls. Present tradeoffs to the sponsor, approve a recovery baseline, then track short evidence-based checkpoints.'
};

const chatNorm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

function chatLoad(){if(chatSessionLoaded)return;chatSessionLoaded=true;try{let h=JSON.parse(sessionStorage.getItem(CHAT_SESSION_KEY)||'[]');if(Array.isArray(h))chatMessages=h.slice(-35).filter(x=>x&&['user','assistant'].includes(x.role)&&typeof x.text==='string');}catch(e){}}
function chatStore(){try{sessionStorage.setItem(CHAT_SESSION_KEY,JSON.stringify(chatMessages.slice(-35)))}catch(e){}}
function chatGuide(section=tab){if(section==='overview'&&mode==='program')return {...CHAT_PAGES.program,prompts:['Project vs program?','Is Okta part of our program?','Explain this page']};return CHAT_PAGES[section]||{purpose:mMap[section]?.description||'Review the current workspace.',steps:mMap[section]?.help||'Review the available records and validate with the responsible owner.',example:'Use source evidence and named decision-makers.',prompts:['Explain this page','How do I use this section?','What do these fields mean?'],related:'overview'}}

// Current-page question resolver. Reads only the rendered view and this browser's workspace.
function chatPageAnswer(text,q=chatNorm(text)){
 const root=document.getElementById('main');if(!root)return null;
 const intent=/\b(what|which|why|how|explain|define|meaning|show|tell|where|who|status|value|owner|forecast)\b/.test(q);
 if(!intent)return null;
 const pageName=mMap[tab]?.name||'this page';
 const isMeaning=/\b(what does|what is|define|meaning|explain|parameter|field)\b/.test(q);
 // First resolve a visible dashboard metric, including its displayed value and description.
 const metrics=[...root.querySelectorAll('.metric')];
 for(const el of metrics){
  const label=chatNorm(el.querySelector('label')?.textContent?.replace(/\?/g,'')||'');
  if(label.length<5||!chatHas(q,label))continue;
  const value=el.querySelector('.number')?.textContent?.replace(/\s+/g,' ').trim()||'';
  const foot=el.querySelector('.foot')?.textContent?.replace(/\s+/g,' ').trim()||'';
  return {text:label.replace(/\b\w/g,x=>x.toUpperCase())+': '+(value||'Not recorded')+'.'+(foot?' '+foot+'.':''),tag:'Value shown on this page',to:tab};
 }
 // For precise field-meaning questions, use the actual module field guide.
 if(isMeaning&&!/\b(why is|why are|how much|under budget|over budget|below budget)\b/.test(q)){
  const fields=[...new Set([...(window.FIELDS?.[tab]||[]),...Object.keys(window.FIELD_GUIDE?.[tab]||{}),...(tab==='overview'?Object.keys(window.FIELD_GUIDE?.__metrics__||{}):[])])];
  let winner=null,best=0;
  for(const k of fields){
   const section=window.FIELD_GUIDE?.[tab]?.[k]?tab:'__metrics__';
   const aliases=[pretty(k),k.replace(/([A-Z])/g,' $1'),k,...Object.entries(CHAT_ALIASES).filter(([,v])=>v===k).map(([a])=>a)];
   for(const alias of aliases){
    if(chatNorm(alias).length<3||!chatHas(q,alias))continue;
    const score=chatNorm(alias).length+(window.FIELD_GUIDE?.[tab]?.[k]?5:0);
    if(score>best){winner={k,section};best=score}
   }
  }
  if(winner){
   const guide=getFieldGuide(winner.k,winner.section);
   return {text:pretty(winner.k)+': '+guide.meaning+' Ask '+guide.verify+' to confirm the value.',tag:'Parameter on this page',to:tab};
  }
 }
 // Ask about any of the actual cards or sections currently rendered.
 const headings=[...root.querySelectorAll('section.panel h2,.panel-head h2,section.panel h3')];
 const current=headings.map(h=>({h,name:chatNorm(h.textContent)})).filter(x=>x.name.length>5&&chatHas(q,x.name)).sort((a,b)=>b.name.length-a.name.length)[0];
 if(current){
  const card=current.h.closest('.panel');
  const cols=[...card.querySelectorAll('thead th')].map(x=>x.textContent.replace(/\?/g,'').trim()).filter(Boolean);
  const total=card.querySelectorAll('tbody tr').length;
  const details=cols.length?'Its columns are '+cols.slice(0,5).join(', ')+(cols.length>5?', and more.':'.'):card.querySelector('.muted,.hint,.section-intro')?.textContent?.trim()||'Use the related controls to review this section.';
  return {text:current.h.textContent.trim()+': '+details+(cols.length?' '+total+' row'+(total===1?'':'s')+' shown.':''),tag:'Visible section',to:tab};
 }
 // Resolve a referenced record or an explicit row number from this module.
 const list=rows(tab);
 if(list.length){
  let selected=null,idx=-1;
  const ordinal=q.match(/\b(?:row|record)\s+(\d+)\b/),ordinalWord=q.match(/\b(first|second|third|last)\s+(?:row|record|item)\b/);
  if(ordinal){idx=Number(ordinal[1])-1;selected=list[idx]}
  else if(ordinalWord){idx={first:0,second:1,third:2,last:list.length-1}[ordinalWord[1]];selected=list[idx]}
  else {
   for(const [i,r] of list.entries()){
    const idFields=['id','key','deliverable','milestone','initiative','epic','title','name','scenario','team','gate','question','metric','stage'];
    const values=idFields.map(k=>r[k]).filter(x=>typeof x==='string'&&chatNorm(x).length>=4);
    if(values.some(v=>chatHas(q,v))){selected=r;idx=i;break;}
   }
  }
  if(selected){
   const requested=(window.FIELDS?.[tab]||Object.keys(selected)).find(k=>chatHas(q,pretty(k))||chatHas(q,k));
   const name=selected.title||selected.name||selected.id||selected.key||selected.milestone||selected.deliverable||selected.initiative||selected.epic||selected.scenario||selected.team||selected.gate||selected.metric||'Record '+(idx+1);
   const field=requested&&selected[requested]!==undefined?pretty(requested)+': '+String(selected[requested]):'Status: '+String(selected.status||'Not recorded');
   const owner=selected.owner&&!requested?.includes('owner')?' Owner: '+selected.owner+'.':'';
   return {text:name+' — '+field+'.'+owner,tag:'Current register record',to:tab};
  }
 }
 // Name a visible field even if its current module has no explicit guide.
 if(isMeaning){
  const columns=[...root.querySelectorAll('thead th,label')].map(x=>x.textContent.replace(/\?/g,'').trim()).filter(x=>x.length>2);
  const label=columns.find(x=>chatNorm(x).length>4&&chatHas(q,x));
  if(label)return {text:label+' is a field on the '+pageName+' page. It is recorded in this section and used to review the relevant decision or status.',tag:'Visible field',to:tab};
 }
 return null;
}
function chatCompact(text){
 const raw=String(text||'').trim();
 if(raw.length<=390)return raw;
 const blocks=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
 let answer=blocks[0]||raw;
 for(const block of blocks.slice(1)){if(answer.length+block.length+2>440)break;answer+=' \n'+block}
 if(answer.length>440){
   const cut=answer.slice(0,438),end=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('; '));
   answer=(end>190?cut.slice(0,end+1):cut.replace(/\s+\S*$/,'')+'…');
 }
 return answer;
}

 if(/\b(who are you|are you ai|using ai|chatgpt|api key|internet|offline|privacy)\b/.test(q))return payload(['This is built-in contextual help using the current page, field definitions and records saved in your browser. No AI key or external chat service is used.'],'reference','About this help');
 if(/\b(this page|this section|current page|where am i|page overview|page help|explain this page)\b/.test(q)||/^(help|help me|overview|what does this page do|what is this page)$/.test(q))return payload([`${mMap[tab].name}: ${pg.purpose}`,`How to use it: ${pg.steps}`,`Example: ${pg.example}`],pg.related,'Page guidance');
 if(/(how do i|how to|where do i|where can i|what should i|what next|show me how|steps to|how should i|what to do)/.test(q)&&/(edit|add|create|change|update|enter|record|start|use|fill|review|next|work|manage|this|page|section|plan|prepare|set up|track|verify|correct)/.test(q))return payload([`On ${mMap[tab].name}: ${pg.steps}`,`To change a record, select Edit in this section, update the relevant fields and save. Use the ? beside a parameter for its required meaning and verification owner. Check Data Integrity & Verification after edits.`, `Example: ${pg.example}`],pg.related,'Suggested workflow');
 if(/^(how many|number of|count|list)\b/.test(q) && /(record|entr|item|project|risk|dependency|issue)/.test(q)){
   if(q.includes('dependenc'))return payload([`Cross-Team Dependencies contains ${rows('dependencies').length} illustrated records. ${rows('dependencies').filter(r=>!isResolved(r.status)).length} are not marked resolved. These are not live system records.`],'dependencies','Live sample summary');
   if(q.includes('risk')||q.includes('issue'))return payload([`RAID contains ${rows('raid').length} illustrated records, of which ${rows('raid').filter(r=>!isResolved(r.status)).length} are not resolved. Review type, owner, mitigation and due date before deciding what to escalate.`],'raid','Live sample summary');
   return payload([`${mMap[tab].name} currently contains ${rows(tab).length} training records. This number changes when you add or remove records.`],tab,'Live sample summary');
 }
 if(/\b(who approves|who authorizes|who signs off|who can approve|who decides)\b/.test(q)){
   if(/\b(contingency|funding|budget|spending|financial)\b/.test(q))return payload(['A sponsor or delegated financial authority approves increased funding or permitted contingency use according to agreed guardrails. Finance validates the forecast, and the Project Manager presents impact, options and a recommendation; the PM does not automatically authorize spending.'],'financials','Decision rights');
   if(/\b(uat|acceptance|business testing)\b/.test(q))return payload(['The accountable business owner or delegated UAT acceptance authority signs off business acceptance, based on agreed criteria and test evidence. QA provides results and the PM coordinates the readiness decision.'],'quality','Decision rights');
   if(/\b(release|go no go|deployment)\b/.test(q))return payload(['The organization’s named release authority makes Go/No-Go decisions with input from business, QA, technology, security and operations. The PM coordinates readiness evidence and escalations; the PM does not personally waive control gates.'],'release','Decision rights');
   if(/\b(scope|change)\b/.test(q))return payload(['The Product Owner can prioritize the backlog within delegated authority. A material change to agreed project scope, funding or date requires approval from the sponsor or designated change authority.'],'changes','Decision rights');
   if(/\b(charter|project initiation)\b/.test(q))return payload(['The business sponsor or designated authorization body approves the project charter after scope, expected value, major constraints and decision rights have been understood.'],'charter','Decision rights');
 }
 if(/\b(under budget|above budget|budget|contingency|eac|etc|forecast at completion|estimate at completion|estimate to complete|budget variance|financial|overrun|base budget|cost forecast)\b/.test(q)){
  const f=budgetBreakdown();return payload([`Live training financials: approved authorization ${money(f.budget)} = ${money(f.baseBudget)} base estimate + ${money(f.reserve)} contingency. Actuals ${money(f.actual)} + remaining ETC ${money(f.etc)} = EAC ${money(f.eac)}.`,`EAC is ${money(Math.abs(f.eac-f.budget))} ${f.eac>f.budget?'above':'below'} authorization, and ${money(Math.abs(f.eac-f.baseBudget))} ${f.eac>f.baseBudget?'above':'below'} the base estimate. Expected reserve use is ${money(f.draw)}; remaining reserve is ${money(f.remaining)}.`, `This is a forecast, not savings already realized. Confirm that future contracted costs (${money(f.commitments)}) are included in ETC and not double counted.`],'financials','Calculated from workspace');
 }
 if(/\b(data error|audit|integrity|inconsistent|inconsistency|validate|validation|verification|invalid)\b/.test(q)){
  let a=auditWorkspace(),e=a.filter(x=>x.severity==='Error'),r=a.filter(x=>x.severity==='Review');return payload([`The current workspace audit reports ${e.length} internal errors and ${r.length} management-review flags.`,e.length?`First error: ${e[0].module}: ${e[0].message}`:'No structural or arithmetic errors are currently identified by the built-in checks.',`Management-review flags are not necessarily errors; they may require a forecast, capacity or risk decision. Live insurance source evidence is not verified.`],'audit','Calculated from workspace');
 }
 if(/\b(milestone|milestones|roadmap|deadline|schedule|baseline vs forecast|schedule slip|dates|release date)\b/.test(q)&&!q.includes('release vs')){
  let a=rows('roadmap'),pending=a.filter(x=>!isResolved(x.status)),slips=pending.filter(x=>Number.isFinite(dateVal(x.forecast))&&Number.isFinite(dateVal(x.baseline))&&dateVal(x.forecast)>dateVal(x.baseline));return payload([`The integrated roadmap has ${a.length} milestones; ${a.length-pending.length} are marked complete, and ${slips.length} incomplete milestones are forecast later than their baseline dates.`,slips.slice(0,3).map(r=>`${r.milestone}: baseline ${r.baseline}; forecast ${r.forecast}; owner ${r.owner}.`).join('\n')||'No forecast slippage is recorded in the roadmap.',`The PM should confirm the downstream effect on E2E, UAT and release before recommending a date change.`],'roadmap','Calculated from workspace');
 }
 if(/\b(dependency|dependencies|blocked by|external team|interface|interfaces|api delay|okta|policycenter|docusign)\b/.test(q)){
  let a=rows('dependencies').filter(r=>!isResolved(r.status));return payload([`${a.length} dependencies are currently not marked resolved.`,a.slice(0,4).map(r=>`${r.deliverable}: ${r.producer} → ${r.consumer}; needed ${r.neededBy}; forecast ${r.forecast}; status ${r.status}. Impact: ${r.impact}`).join('\n'),`Ask the producing and consuming leads to verify the interface, needed date and impact. Escalate cross-project priority or resource conflicts to the appropriate delivery/governance authority.`],'dependencies','Calculated from workspace');
 }
 if(/\b(capacity|person days|resource|resources|headcount|availability|support reserve|leave|staffing)\b/.test(q)){
  let a=rows('capacity');return payload([`Capacity is planned by team and skill for the sample two-week window.`,a.map(r=>`${r.team}: ${availableDays(r)} person-days available after leave, support and other commitments.`).join('\n'),`Formula: people × working days per person − leave − production support − other commitments. Different skills are not interchangeable. Confirm competing enterprise assignments with functional leads.`],'capacity','Calculated from workspace');
 }
 if(/\b(qa|quality|test|tests|uat|defect|defects|pass rate|failed|blocked)\b/.test(q)){
  let planned=sum('quality','planned'),passed=sum('quality','passed'),failed=sum('quality','failed'),blocked=sum('quality','blocked');return payload([`The formal sample test register shows ${planned} planned tests: ${passed} passed, ${failed} failed, ${blocked} blocked; the remaining cases are not yet passed/failed/blocked.`,`These are integrated/controlled scenarios, not necessarily every story-level test. The PM coordinates delivery impact; QA supplies quality evidence and business owners authorize acceptance.`],'quality','Calculated from workspace');
 }
 if(/\b(overcommitted|overcommitment|sprint points|velocity|iteration|pi total|pi objective)\b/.test(q)){
  let r=rows('iterations');let over=r.filter(x=>String(x.iteration||'').toUpperCase().startsWith('S')&&num(x.planned)>num(x.capacity));return payload([`${over.length} sample sprints have planned points above their capacity.`,over.map(x=>`${x.iteration}: ${x.planned} planned vs ${x.capacity} available relative points.`).join('\n')||'No point overcommitment in the sample sprint rows.',`Relative planning points are not person-days, and must not be compared across unrelated teams. The Product Owner and team plan sprint commitments; the PM tracks downstream project forecast.`],'iterations','Calculated from workspace');
 }
 if(/\b(status|rag|amber|red|green|escalation status|project health)\b/.test(q)&&!q.includes('status / state')){
  let r=rows('reports')[0];return payload([`The current training report shows overall ${r?.overall||'not assessed'}, schedule ${r?.schedule||'not assessed'}, budget ${r?.budget||'not assessed'}, scope ${r?.scope||'not assessed'} and quality ${r?.quality||'not assessed'}.`,r?.narrative?`Recorded rationale: ${r.narrative}`:'No narrative is recorded.',`RAG should reflect the integrated forecast and agreed tolerances—not the number of green sprint boards. Review dependencies and audit findings before claiming an improvement.`],'reports','Live sample status');
 }
 if(/\b(ws jf|wsjf|weighted shortest job first)\b/.test(q))return payload([`WSJF = (Business Value + Time Criticality + Risk Reduction/Opportunity Enablement) ÷ Job Size.`,rows('safelp').map(r=>`${r.epic}: ${num(r.jobSize)?((num(r.businessValue)+num(r.timeCriticality)+num(r.riskReduction))/num(r.jobSize)).toFixed(2):'invalid size'} (relative score).`).join('\n'),`Portfolio leaders use the scores to inform—not automatically determine—investment decisions.`],'safelp','Calculated from workspace');
 if(/\b(flow efficiency|working time|waiting time|lead time|value stream map)\b/.test(q)){
  let work=sum('value','workingDays'),wait=sum('value','waitingDays');return payload([`The sample current-state servicing map contains ${work.toFixed(2)} active working days and ${wait.toFixed(2)} waiting days.`, `Flow efficiency = active time ÷ (active + waiting) = ${work+wait?((100*work/(work+wait)).toFixed(1)+'%'):'undefined'}. This is a model of the existing manual journey, not measured results from the unreleased portal enhancement.`],'value','Calculated from workspace');
 }
 // Resolve explicit parameter names by preferentially searching the current page.
 const findField=()=>{
   let sections=[section,...Object.keys(window.FIELD_GUIDE||{}).filter(x=>x!==section)];
   let match=null,rank=0;
   for(let s of sections){let guides=window.FIELD_GUIDE?.[s]||{};for(let k of Object.keys(guides)){
     let names=[pretty(k),k.replace(/([A-Z])/g,' $1'),k];for(let [alias,key] of Object.entries(CHAT_ALIASES))if(key===k)names.push(alias);
     for(let name of names){if(name.length<3||!chatHas(q,name))continue;let score=chatNorm(name).length+(s===section?25:0);if(score>rank){match=[k,s];rank=score;}}
   }}return match;
 };
 if(/\b(what is|what does|meaning|define|explain|parameter|field|metric|why|how is)\b/.test(q)){
   let match=findField();if(match)return chatAnswer(text,match[0],match[1]);
 }
 for(let f of CHAT_FAQ){if(f.keys.some(k=>chatHas(q,k)||k.endsWith('iz')&&q.includes(k))){return payload([f.answer],f.to,'Management guidance');}}
 if(/\b(how to|how do|what should|what is|explain)\b/.test(q)){
   // In-context intent for a short, ambiguous question without a recognized technical term.
   if(/\b(this|here|section|page|now)\b/.test(q))return payload([`${mMap[tab].name}: ${pg.purpose}`,pg.steps,`Example: ${pg.example}`],pg.related,'Page guidance');
 }
 if(pg.prompts.some(p=>chatNorm(p)===q))return payload([`${mMap[tab].name}: ${pg.purpose}`,`Approach: ${pg.steps}`,`Example: ${pg.example}`],pg.related,'Page guidance');
 return payload([`I don't have a reliable offline answer for that exact question. I can help with ${mMap[tab].name}, its parameters, training records, and built-in project/program management concepts.`,`Ask about a visible field, record or section; I can explain its meaning and the next action shown here.`],null,'Help scope');
}
function chatAdd(role,text,tag='',to=null){chatMessages.push({role,text,tag,to});chatMessages=chatMessages.slice(-35);chatStore();chatDrawMessages()}
function chatDrawMessages(){const log=document.getElementById('chatLog');if(!log)return;log.innerHTML=chatMessages.map((x,i)=>`<div class="chat-msg ${x.role==='user'?'chat-msg-user':'chat-msg-assistant'}"><div class="chat-msg-tag">${esc(x.role==='user'?'You':x.tag||'Context help')}</div><div class="chat-msg-body">${chatHTML(x.text)}</div>${x.to&&mMap[x.to]?`<button class="chat-go" data-chat-go="${esc(x.to)}">Open ${esc(mMap[x.to].name)} →</button>`:''}</div>`).join('');log.scrollTop=log.scrollHeight}
function chatDrawChips(){let el=document.getElementById('chatSuggestions');if(!el)return;el.innerHTML=chatVisiblePrompts().map(x=>`<button type="button" class="chat-chip" data-chat-ask="${esc(x)}">${esc(x)}</button>`).join('')}
function chatSync(){let context=tab+'|'+mode+'|'+(workspaceId||'seed');const label=document.getElementById('chatContext');if(label)label.textContent=`${mode==='project'?'Project':'Program'} · ${mMap[tab]?.name||'Workspace'}`;const source=document.getElementById('chatSource');if(source){const n=rows(tab).length,fields=window.FIELDS?.[tab]||[];source.textContent=`${mMap[tab]?.name||'Page'} · ${n} records · ${fields.length?fields.length+' fields':'dashboard sections'}`;}if(chatContextLast!==context){chatContextLast=context;chatDrawChips();}}
function chatToggle(force){const panel=document.getElementById('chatPanel'),launcher=document.getElementById('chatLauncher');if(!panel)return;chatOpen=typeof force==='boolean'?force:!chatOpen;panel.hidden=!chatOpen;launcher.setAttribute('aria-expanded',String(chatOpen));document.body.classList.toggle('chat-is-open',chatOpen);if(chatOpen){chatSync();if(!chatMessages.length)chatAdd('assistant',`${mMap[tab].name}: ${chatGuide().purpose}\nAsk about any visible field, section or record.`,'Page guide');document.getElementById('chatQuestion')?.focus();}else{launcher.focus()}}
function chatAsk(text,forcedField=null,forcedSection=null){let q=String(text||'').trim().slice(0,400);if(!q)return;chatAdd('user',q);let a=chatAnswer(q,forcedField,forcedSection);chatAdd('assistant',chatCompact(a.text),a.tag,a.to);let input=document.getElementById('chatQuestion');if(input)input.value='';}
function chatForField(field,section){closeFieldHelp(false);chatToggle(true);chatAsk(`Explain ${pretty(field)} in ${mMap[section]?.name||'dashboard metrics'}`,field,section)}
function initChat(){
 if(document.getElementById('chatLauncher'))return;
 chatLoad();
 const wrapper=document.createElement('div');wrapper.id='chatDock';wrapper.innerHTML=`<button type="button" id="chatLauncher" aria-label="Open contextual help chat" aria-expanded="false" aria-controls="chatPanel"><span aria-hidden="true">✦</span> Ask for help</button><section class="chat-panel" id="chatPanel" role="dialog" aria-modal="false" aria-label="Contextual help assistant" hidden><header class="chat-head"><div><strong>Project & Program Guide</strong><small id="chatContext">Current page</small></div><button type="button" id="chatClose" aria-label="Close help chat">✕</button></header><div class="chat-offline"><span class="chat-online-dot"></span> <span id="chatSource">Current workspace · section data</span></div><div id="chatLog" class="chat-log" role="log" aria-live="polite" aria-relevant="additions text"></div><div id="chatSuggestions" class="chat-suggestions" aria-label="Questions about this page"></div><form id="chatForm" class="chat-form"><label for="chatQuestion" class="chat-label">Ask about this page, a field, or a decision</label><div class="chat-compose"><textarea id="chatQuestion" rows="2" maxlength="400" placeholder="e.g., Why is EAC below the approved budget?" required></textarea><button type="submit" aria-label="Send help question">Send</button></div><div class="chat-foot">Based on visible sections, field definitions and the selected workspace. Open related registers to inspect the evidence.</div></form></section>`;
 document.body.append(wrapper);chatSync();chatDrawMessages();
 wrapper.addEventListener('click',e=>{if(e.target.closest('#chatLauncher'))chatToggle();else if(e.target.closest('#chatClose'))chatToggle(false);else if(e.target.closest('[data-chat-ask]'))chatAsk(e.target.closest('[data-chat-ask]').dataset.chatAsk);else if(e.target.closest('[data-chat-go]')){let target=e.target.closest('[data-chat-go]').dataset.chatGo;if(mMap[target]){tab=target;filter='';main();window.scrollTo({top:0,behavior:'auto'});chatSync();}}});
 wrapper.querySelector('#chatForm').addEventListener('submit',e=>{e.preventDefault();chatAsk(wrapper.querySelector('#chatQuestion').value)});
 wrapper.querySelector('#chatQuestion').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();chatAsk(e.currentTarget.value)}});
 document.addEventListener('click',e=>{let btn=e.target.closest('[data-chat-field]');if(btn){e.preventDefault();e.stopPropagation();chatForField(btn.dataset.chatField,btn.dataset.chatSection||tab)}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&chatOpen&&!document.getElementById('fieldHelpPopup')&&!document.querySelector('.modal'))chatToggle(false)});
}
initChat();
</script></body></html>
