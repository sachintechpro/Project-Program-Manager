/* Responsive v1.1: layout adapts without losing records or workflow controls. */
html { -webkit-text-size-adjust:100%; }
body { min-width:0; }
.content, .shell, .topbar, .page, .panel, .panel-head, .toolbar, .mini-item { min-width:0; }
button, select, input, textarea { max-width:100%; }
.btn, .navbtn { touch-action:manipulation; }
.btn:focus-visible, .navbtn:focus-visible, .tab:focus-visible, .sidebar-close:focus-visible, .mobile-tools-toggle:focus-visible {outline:3px solid #87b5ff;outline-offset:2px;}
.topbar-primary { min-width:0; display:flex; align-items:center; flex:1; }
.topbar-brand { min-width:0; }
.topbar-title { font-size:13px; line-height:1.25; display:block; }
.mobile-tools-toggle, .sidebar-close { display:none; }
.sidebar-backdrop[hidden] { display:none!important; }
.sidebar-backdrop { position:fixed; inset:0; background:rgba(8,18,33,.55); z-index:30; }
.brand { position:relative; }
.panel-head > div { min-width:0; }
.page-head h1, .panel h2, .panel h3, .metric .number, td, .mini-item, .help, .notice { overflow-wrap:anywhere; }
.table-wrap { -webkit-overflow-scrolling:touch; }
.tab, .btn { min-height:38px; }
@media(max-width:1180px) and (min-width:741px) {
 .shell {grid-template-columns:240px minmax(0,1fr)}
 .topbar {height:auto; min-height:70px; padding:12px 18px; flex-wrap:wrap}
 .topright {justify-content:flex-end}
 .page {padding:22px 20px 54px}
 .cards {grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:740px) {
 .shell {display:block; min-height:100dvh}
 .content {width:100%;min-width:0}
 .drawer-open {overflow:hidden}
 .sidebar {position:fixed;top:0;left:0;bottom:0;z-index:40;width:min(86vw,320px);height:100vh;height:100dvh;transform:translateX(-105%);transition:transform .2s ease;overscroll-behavior:contain;padding:12px 9px 25px;box-shadow:8px 0 30px #0002;visibility:hidden}
 .sidebar.open {transform:translateX(0);visibility:visible}
 .sidebar-close {display:inline-grid;place-items:center;position:absolute;right:7px;top:6px;width:40px;height:40px;border:0;background:#293b59;color:#fff;border-radius:8px;font-size:18px}
 .brand {padding-right:43px}
 .navbtn {min-height:43px;font-size:13px}
 .topbar {display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;height:auto;min-height:64px;padding:10px 12px;z-index:20;box-shadow:0 1px 5px #17253c0a}
 .topbar-primary {gap:9px}
 .hamburger {display:inline-flex;align-items:center;justify-content:center;min-width:42px;min-height:42px;font-size:20px;flex:0 0 auto;padding:7px}
 .topbar-brand .crumb {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
 .topbar-title {font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:360px}
 .mobile-tools-toggle {display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 11px;flex:0 0 auto}
 .topright {display:none;grid-column:1/-1;position:absolute;top:100%;left:0;right:0;background:#fff;z-index:21;padding:12px;box-shadow:0 12px 24px #17253c22;border-top:1px solid var(--line);border-bottom:1px solid var(--line);gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
 .topright.open {display:grid}
 .topright .pill {display:none}
 .topright .select {grid-column:1/-1;width:100%;min-height:44px}
 .topright .btn {min-height:44px;white-space:normal;padding:8px}
 .page {max-width:100%;padding:18px 12px calc(45px + env(safe-area-inset-bottom,0px))}
 .page-head {display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-bottom:16px}
 .page-head h1 {font-size:clamp(22px,5vw,28px);letter-spacing:-.45px;line-height:1.2}
 .page-head p {font-size:13px;line-height:1.5}
 .page-head > .toolbar {display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin:0}
 .page-head > .toolbar .btn {width:100%;min-height:43px;white-space:normal}
 .cards {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
 .metric {padding:14px;min-height:108px}
 .metric label {font-size:11px;line-height:1.4}
 .metric .number {font-size:clamp(18px,5vw,25px);line-height:1.25;margin:10px 0 5px}
 .metric .number.small {font-size:18px}
 .grid2,.grid3,.info-grid,.formgrid {grid-template-columns:1fr;gap:12px}
 .info-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
 .panel {padding:15px;margin-bottom:12px}
 .panel-head {align-items:flex-start;flex-wrap:wrap;gap:10px}
 .panel-head .search {width:100%;min-width:0;flex:1 0 100%;min-height:44px}
 .panel-head > .btn {min-height:40px}
 .help {padding:12px;font-size:12px}
 .timelinerow {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
 .timelinerow .label {grid-column:1;font-size:12px}
 .timelinerow .muted {grid-column:2;grid-row:1;text-align:right}
 .timeline-track {grid-column:1/-1;grid-row:2;height:12px}
 .statline {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin:12px 0}
 .statline > span:first-child {grid-column:1/-1;width:auto!important;min-width:0;font-size:12px}
 .statline .bar {min-width:0;grid-column:1}
 .statline > strong {grid-column:2;min-width:0!important}
 .table-wrap:not(.records-wrap) {max-width:100%;overflow:auto}
 .table-wrap:not(.records-wrap) table {min-width:620px}
 .records-wrap {overflow:visible;border:0;border-radius:0}
 .record-table, .record-table tbody {display:block;width:100%;white-space:normal}
 .record-table thead {display:none}
 .record-table tbody {display:grid;gap:11px}
 .record-table tr {display:block;background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:0 1px 2px #17253c0a}
 .record-table tr:hover {background:white}
 .record-table td {position:static!important;display:grid;grid-template-columns:minmax(105px,38%) minmax(0,1fr);gap:10px;align-items:start;white-space:normal;word-break:normal;overflow-wrap:anywhere;padding:9px 11px;background:white!important;line-height:1.45;border-bottom:1px solid #eef2f7;font-size:12px;min-width:0}
 .record-table td::before {content:attr(data-label);font-size:11px;font-weight:650;color:var(--sub);line-height:1.4}
 .record-table td:first-child {display:block;padding:13px 11px;background:#f6f9ff!important;font-size:14px;font-weight:750;color:var(--ink)}
 .record-table td:first-child::before {display:block;margin-bottom:4px;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
 .record-table td.record-actions {display:block;background:#f9fbfe!important;border-bottom:0;padding:9px 11px}
 .record-table td.record-actions::before,.record-table .empty::before {display:none}
 .record-table td.record-actions .btn {width:100%;min-height:42px}
 .record-table .empty {display:block;padding:20px}
 .modal {padding:0;align-items:flex-end}
 .dialog {width:100%;max-width:100%;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0}
 .dialog-header {padding:16px 16px 13px;gap:12px}
 .dialog-header h2 {font-size:17px;min-width:0;overflow-wrap:anywhere}
 .dialog-body {padding:16px;overscroll-behavior:contain}
 .formgrid {gap:12px}
 .formgroup input,.formgroup select,.formgroup textarea,.search,.field {font-size:16px;min-height:44px}
 .dialog-footer {padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;gap:8px}
 .footer-actions {margin-left:auto;flex:1;justify-content:flex-end;min-width:0}
 .footer-actions .btn {min-height:44px;flex:1 1 auto}
 .toast {left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:none}
 .tabs {flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px}
 .tab {flex:0 0 auto;min-height:43px}
 .reading {padding:12px;max-height:70dvh;line-height:1.7;font-size:12px}
 .scenario {padding:13px}
 .scenario textarea {font-size:16px;min-height:110px}
}
@media(max-width:390px){
 .page {padding:14px 10px 40px}
 .panel {padding:12px}
 .metric {padding:12px;min-height:115px}
 .info-grid {grid-template-columns:1fr}
 .topbar-title {font-size:11px}
 .record-table td {grid-template-columns:minmax(95px,37%) minmax(0,1fr);gap:7px}
}
@media(prefers-reduced-motion:reduce){.sidebar {transition:none!important}}

window.REFERENCE="The best way to learn this is to follow one insurance initiative from customer problem to measurable business results—and examine who makes each decision along the way.\n\nFor a project or program manager, the central job is not assigning every developer’s work. It is creating a delivery system in which the right people make timely decisions about value, scope, funding, dependencies, risk, and production readiness. In an agile organization, product owners prioritize team backlogs, while delivery leadership coordinates capacity, technical dependencies, and the flow of work across teams.\n\nI’ll interpret “safe agile” as **SAFe**, the Scaled Agile Framework. Below is a practical operating guide using a property-and-casualty insurance example. The company, financial figures, staffing, schedules, and targets are illustrative—not industry benchmarks.\n\n## 1. First understand the roles: project, program, product, and value stream\n\nThese are different perspectives on the same investment.\n\n| Perspective | Main question | Example in a P&C insurer |\n|---|---|---|\n| Project management | How do we deliver a defined change within agreed constraints? | Launch digital auto-claim reporting for an initial customer segment |\n| Program management | How do related initiatives, dependencies, and organizational changes combine to produce benefits? | Coordinate digital reporting, claims-system changes, adjuster workflows, analytics, and training |\n| Product management | What customer and business problems should we solve next? | Own the ongoing digital claims roadmap |\n| Value-stream management | How do we improve the end-to-end flow of value, including building and operating the supporting technology? | Reduce delays from a customer reporting a loss to receiving an appropriate claims response |\n\nSAFe distinguishes operational value streams—the activities that deliver value to customers—from development value streams, which build, support, and maintain the solutions enabling those activities. Its funding model emphasizes persistent value streams rather than repeatedly assembling temporary project teams. [scaledagileframework](https://scaledagileframework.com/lean-portfolio-management)\n\nFor your career, learn to distinguish these responsibilities even when one company combines several into a single job title.\n\nA program manager and a Release Train Engineer, or RTE, may have overlapping responsibilities, but do not assume they are identical. The actual scope depends on the organization: delivery coordination may sit with an RTE while commercial contracts, investment governance, organizational change, and benefit realization sit elsewhere. Project and program responsibilities can overlap, but their authority and scope differ by operating model.\n\n## 2. The running example: digital auto-claim reporting\n\nImagine an insurer receives this feedback:\n\n> “After an accident, customers wait on the phone, repeat information, and cannot easily upload photos. Adjusters receive incomplete claims and call customers back.”\n\nThe proposed initiative is digital **First Notice of Loss**, or FNOL: letting customers report a loss, provide relevant details, upload documents or photos, and receive confirmation.\n\nThis is a realistic P&C technology scenario. Claims intake can integrate with policy lookup, assignment, triage, and underwriting or billing interfaces. A digital auto FNOL workflow can include vehicle and injury information, third-party details, photo uploads, and preferred contact methods. [guidewire](https://www.guidewire.com/products/core-products/insurancesuite/claimcenter-claims-management-software)\n\n### Define the outcome before approving the solution\n\nFor this hypothetical initiative:\n\n| Dimension | Illustrative baseline | Illustrative target |\n|---|---:|---:|\n| Median time to complete eligible FNOL | 25 minutes | 10 minutes |\n| Eligible claims submitted digitally | 0% | 35% |\n| Claims requiring follow-up for missing intake information | 30% | Below 15% |\n| Customer experience | Baseline collected during discovery | Meaningful improvement |\n| Safety measures | Existing operational baseline | No unacceptable increase in duplicate claims, errors, or service failures |\n\nThe point is not that these particular numbers are correct. It is that the sponsor approves a measurable business hypothesis, not merely “build a portal.”\n\n## 3. Who are your stakeholders?\n\nYour stakeholder map should identify four things:\n\n1. Who owns the business outcome?\n2. Who can authorize money or accept risk?\n3. Who must contribute work or decisions?\n4. Who will use, operate, or be affected by the solution?\n\nHere is a proposed stakeholder map for the example. Exact titles and approval authority must be agreed with the insurer.\n\n| Stakeholder | What they care about | What you need from them |\n|---|---|---|\n| Executive sponsor / claims executive | Claims service, operating cost, customer outcomes | Outcome ownership, funding sponsorship, escalation decisions |\n| Portfolio leadership / investment committee | Strategic fit and competing investments | Investment authorization and priority |\n| Product manager | Customer problems, roadmap, feature value | Clear priorities and scope trade-offs |\n| Product owner | Team backlog and acceptance | Ready stories, acceptance criteria, rapid clarification |\n| Claims operations and adjuster representatives | Accurate intake and workable processes | Process design, exceptions, business acceptance |\n| Customer-service and agent representatives | Channel continuity and customer communication | Feedback, training needs, escalation paths |\n| Engineering leads and teams | Feasible implementation and quality | Estimates, delivery plans, technical execution |\n| Enterprise / solution architect | Integration, resilience, technical direction | Architecture decisions and dependency identification |\n| Policy-system and claims-system owners | Correct interfaces and reliable operations | Integration capacity and interface commitments |\n| Security, privacy, legal, compliance | Appropriate controls and regulatory interpretation | Requirements, reviews, documented approvals |\n| Testing and quality specialists | Evidence that the solution works end to end | Test strategy, automation, defect transparency |\n| Operations / SRE / service desk | Reliable service and supportability | Monitoring, runbooks, support acceptance |\n| Finance and procurement | Cost, forecasts, contracts | Financial controls and vendor arrangements |\n| Vendors / systems integrators | Contract scope and delivery obligations | Named deliverables and dependency commitments |\n| Data and analytics | Reliable measurement | Instrumentation, baselines, outcome reporting |\n| Project / program manager | Integrated delivery and decision flow | A coherent plan, visible risks, resolved dependencies |\n\nThe division between product and delivery matters: Backlog sequencing and acceptance sit with product ownership, while program coordination often includes capacity monitoring and alignment across teams.\n\n### Make decision rights explicit\n\nUse a simple decision register—not just a large RACI chart.\n\n| Decision | Proposed accountable authority | Your role as PM / program manager |\n|---|---|---|\n| Is this investment worth pursuing? | Sponsor / portfolio authority | Present evidence, options, cost range, risks |\n| Which features come first? | Product management | Show delivery and dependency consequences |\n| How should the system be implemented? | Engineering / architecture authority | Ensure timely decisions and cross-team alignment |\n| Can additional spending be authorized? | Delegated financial authority | Produce forecast and decision request |\n| Are controls adequate? | Relevant control owner | Track evidence, findings, exceptions |\n| Can we release to customers? | Named release authority under company policy | Assemble readiness evidence and recommendation |\n| Who owns an incident? | Service owner / incident commander | Coordinate delivery-side support and communications |\n| Did the initiative achieve its benefits? | Business outcome owner | Ensure measurement and review happen |\n\nDo not accept “the committee owns it” without knowing who can actually decide.\n\n## 4. How decisions move from feedback to production\n\nSAFe uses portfolio Kanban to make large initiatives visible as they move from ideas through analysis and implementation. Portfolio leadership decides which deserve further investment; smaller improvements need not all become portfolio-level initiatives. [scaledagileframework](https://scaledagileframework.com/portfolio-backlog/)\n\nThe following is a proposed practical workflow—not a claim that every insurer uses these exact gates.\n\n| Stage | Main question | Key participants | Evidence / deliverable | Possible decision |\n|---|---|---|---|---|\n| 1. Intake | Is there a real problem worth examining? | Business, product, customer-facing teams | Problem statement, feedback, initial data | Investigate, merge, defer, reject |\n| 2. Discovery | What causes the problem, and who experiences it? | Product, claims SMEs, UX, engineering, analytics | Current process, baseline, options, constraints | Test a hypothesis or stop |\n| 3. Investment analysis | Is the expected value worth the cost and risk? | Sponsor, finance, product, architecture, controls | Lean business case, cost range, MVP, risks | Fund discovery/MVP, revise, reject |\n| 4. Delivery planning | Can teams deliver a useful increment? | Product, teams, RTE, PM, vendors | Objectives, capacity, dependencies, release forecast | Commit to a realistic plan |\n| 5. Build and validate | Does the integrated solution work? | Teams, testers, business users, control owners | Demonstrated increments and test evidence | Accept, adjust, rework |\n| 6. Release readiness | Can customers and operations safely use it? | Business, engineering, operations, release authority | Readiness pack, rollout and recovery plans | Go, conditional go, no-go |\n| 7. Operate | Is the service stable and supportable? | Service owner, support, engineering | Telemetry, incidents, support metrics | Expand rollout, pause, recover |\n| 8. Benefits review | Did the change improve the intended outcome? | Sponsor, product, operations, analytics | Results versus baseline | Expand, improve, stop further investment |\n\n### Example: a genuine scope decision\n\nDuring discovery, someone proposes automatic claim-payment approval.\n\nThat is not simply “one more screen.” It changes the business decision being automated.\n\nFor this example, you present two options:\n\n- Initial release: collect claim information, create or update the appropriate intake record, confirm receipt, and route work to an adjuster.\n- Later investment: evaluate automated decisions with separate business rules, controls, evidence, and outcome measures.\n\nThe sponsor and product leadership choose the business scope; engineering and control owners assess feasibility and safeguards. Your job is to make the consequences visible before the team inherits an unexamined commitment.\n\n## 5. Organize the work around a value stream\n\nFor the example, map two connected flows.\n\n### Operational flow\n\nCustomer experiences loss → reports loss → insurer captures and checks information → claim is triaged and assigned → investigation and adjustment → resolution.\n\n### Development flow\n\nFeedback → prioritization → discovery → design → implementation → validation → release → operation → measured learning.\n\nThese are related but not interchangeable. SAFe’s development value streams create and maintain the solutions used by operational value streams. An Agile Release Train, or ART, is a long-lived team of agile teams delivering—and often operating—solutions within that structure. [scaledagileframework](https://scaledagileframework.com/lean-portfolio-management)\n\n### How to improve the flow\n\nFor the FNOL example, run a workshop with business, delivery, and operations:\n\n1. Map the actual steps.\n2. Record working time and waiting time separately.\n3. Identify handoffs and rework.\n4. Locate constraints: policy API access, claims SME availability, test environments, approvals.\n5. Choose a small number of improvements.\n6. Measure whether end-to-end delivery improves.\n\nFor example, faster coding will not materially help if every completed change waits three weeks for an integration environment.\n\nAvoid calling every department a value stream. A useful value-stream view follows value across organizational boundaries rather than stopping at them.\n\n## 6. Plan delivery in a SAFe environment\n\nIn SAFe, PI Planning aligns the ART’s teams and stakeholders around a shared mission and objectives. Portfolio priorities, product direction, team capacity, and cross-team dependencies must meet in that planning process. [scaledagileframework](https://scaledagileframework.com/glossary/)\n\nFor your example, suppose the insurer chooses a ten-week planning interval. That duration is an illustrative planning choice here.\n\n### Before planning\n\nAs PM or program manager, coordinate preparation so that:\n\n- Product priorities are clear.\n- Teams have enough discovery to discuss the work meaningfully.\n- Architecture and integration uncertainties are visible.\n- Capacity reflects leave, support, and shared assignments.\n- Vendors and dependent teams can state their commitments.\n- Business SMEs have reserved time.\n- Release and environment constraints are known.\n\nDo not arrive with a fixed executive scope and ask teams to make the estimates fit.\n\n### During planning\n\nFacilitate agreements about:\n\n- Business objectives.\n- Team plans and dependencies.\n- Integration milestones.\n- Major risks and named owners.\n- What can reasonably be forecast.\n- What must remain conditional.\n\n### After planning\n\nManage exceptions and decisions rather than recreating every team’s task board.\n\nA useful dependency entry looks like this:\n\n> Policy-services team must provide a production-representative test endpoint by June 12. Owner: policy-services lead. Consumer: FNOL team. Impact if missed: integrated testing moves two weeks. Escalation date: June 5.\n\nThat is more useful than “Policy API dependency—amber.”\n\n### Separate deployment from release\n\nTreat these as two distinct planning questions:\n\n- Can the software be deployed into production safely?\n- Should the capability be exposed to a particular customer group now?\n\nFor the example, feature flags and a controlled rollout can make those separate decisions possible. Whether the architecture supports that is something engineering must verify.\n\n## 7. Budget planning: turn staffing into a credible forecast\n\nSAFe’s Lean Budgets approach allocates funding to value streams, with guardrails for governance, rather than relying solely on temporary project funding. That does not eliminate the need to understand the cost and expected return of a particular initiative. [scaledagileframework](https://scaledagileframework.com/lean-portfolio-management-discipline)\n\nUse two views:\n\n- Value-stream view: what does it cost to sustain the teams and services?\n- Initiative view: what capacity, incremental spending, and operating cost does this change consume?\n\n### Illustrative six-month budget\n\nAssume two teams with 16 full-time-equivalent staff in total. For this exercise, the blended fully loaded cost is $15,000 per FTE-month.\n\n| Cost category | Illustrative amount |\n|---|---:|\n| Delivery teams: 16 × $15,000 × 6 months | $1,440,000 |\n| Specialist vendor support | $180,000 |\n| Incremental cloud, environments, and tooling | $90,000 |\n| Training and operational readiness | $50,000 |\n| Base estimate | $1,760,000 |\n| Contingency allowance | $240,000 |\n| Total proposed authorization | $2,000,000 |\n\nThese are assumptions, not market-rate estimates. State what the blended rate includes so you do not double-count architecture, management, benefits, vendor staff, or overhead.\n\nAlso separate one-time delivery expenditure from recurring production costs. Finance should determine the applicable accounting treatment.\n\n### Track forecast, not just spending\n\nYour financial dashboard should include:\n\n- Approved budget.\n- Actual cost to date.\n- Remaining contractual commitments.\n- Estimate to complete.\n- Estimate at completion.\n- Contingency remaining.\n- Assumptions and confidence range.\n\nUse:\n\n\\[\n\\text{Estimate at completion} = \\text{Actual cost to date} + \\text{Estimate to complete}\n\\]\n\nA project can be “under budget” today because it is late and has not done the work. That does not make it financially healthy.\n\n### Test the business case honestly\n\nFor the FNOL example, distinguish:\n\n- Cash savings.\n- Staff capacity released.\n- Customer-experience improvements.\n- Avoided operational risk.\n- New recurring costs.\n\nIf employees spend less time on intake but staffing costs do not change, describe that as capacity released—not automatically as cash savings.\n\n## 8. Resource planning: availability is not capacity\n\nA staffing spreadsheet answers “Who is assigned?” A delivery plan must also answer “How much usable capacity exists, with which skills, at what time?”\n\nProgram leadership and delivery leads coordinate on capacity planning and monitoring. SAFe portfolio planning also emphasizes matching proposed work against available capacity.\n\n### Illustrative team-capacity calculation\n\nFor one two-week iteration:\n\n| Item | Person-days |\n|---|---:|\n| Eight people × ten working days | 80 |\n| Leave and holidays | −8 |\n| Expected production-support work | −12 |\n| Planning, learning, and other non-feature work | −10 |\n| Forecast available for planned delivery | 50 |\n\nThis is a local planning model, not a universal formula. Use historical evidence and avoid subtracting the same work twice.\n\nThen check whether those 50 person-days contain the skills actually needed. Ten available frontend days cannot substitute for an unavailable claims-integration specialist.\n\n### Common capacity constraints to investigate\n\nFor this case, explicitly check:\n\n- Claims SMEs and business testers.\n- Policy and claims integration engineers.\n- Security and privacy reviewers.\n- Test-data specialists.\n- Environment support.\n- Vendor specialists.\n- Production-support coverage.\n\nAlso:\n\n- Avoid treating people assigned to three initiatives as fully available to all three.\n- Reserve capacity for production work.\n- Do not compare story-point totals across teams as if they were a common productivity currency.\n- Do not assume adding people late will immediately increase throughput.\n- Preserve stable teams where possible.\n\nYour staffing plan should include required dates and allocation—not just names and job titles.\n\n## 9. P&C-specific questions that change the delivery plan\n\nClaims technology is not only a digital interface. It connects policy information, claims workflows, assignment, data, and operational services. Claims management platforms illustrate these integration and lifecycle concerns. [guidewire](https://www.guidewire.com/products/core-products/insurancesuite/claimcenter-claims-management-software)\n\nUse the following as a proposed discovery and testing checklist. Legal and compliance must identify the rules that actually apply to the product, jurisdiction, and process.\n\n| Area | Questions to resolve |\n|---|---|\n| Policy context | Can the system retrieve the relevant policy information for the reported loss date? |\n| Intake versus coverage decision | Does the interface clearly distinguish receiving a report from confirming coverage? |\n| Complex losses | What happens with injuries, multiple vehicles, third parties, or incomplete information? |\n| Duplicate reporting | What if the same loss is reported online, by phone, and by an agent? |\n| Partial failures | What if the claim is created but photo upload or confirmation fails? |\n| Catastrophe demand | Can intake and support operate during unusually high volumes? |\n| Privacy and security | Who may access documents, photographs, and personal information? |\n| Auditability | Can relevant actions and changes be reconstructed? |\n| Accessibility and channels | Can customers complete the process, and is an assisted alternative available? |\n| Operational ownership | Who handles records that require manual intervention? |\n\nOne especially important boundary: technical policy lookup is not, by itself, a final coverage determination.\n\n## 10. Build production and support into the plan from the beginning\n\nDo not define success as “development finished.”\n\nFor the FNOL example, propose explicit release-readiness criteria covering:\n\n### Business readiness\n\n- Agreed scenarios accepted by claims operations.\n- Exception handling understood.\n- Customer and employee communications prepared.\n- Training and support material available.\n\n### Technical readiness\n\n- End-to-end integration demonstrated.\n- Security findings resolved or explicitly accepted by authorized owners.\n- Performance and resilience evidence reviewed.\n- Monitoring and alerts tested.\n- Deployment and recovery procedures rehearsed.\n\n### Service readiness\n\n- Named service owner and escalation contacts.\n- Service-desk knowledge articles and runbooks.\n- Agreed severity levels and response expectations.\n- Vendor escalation arrangements.\n- Hypercare staffing and exit criteria.\n- A plan for incomplete transactions and data reconciliation.\n\nA code rollback does not necessarily reverse business records already created. Ask engineering and operations how they will recover the business process, not merely redeploy an earlier software version.\n\n### Define hypercare exit criteria\n\nFor example:\n\n- No unresolved critical incidents.\n- Transaction success meets the agreed threshold.\n- Manual exception volume is manageable.\n- Support can handle routine cases without the project team.\n- Monitoring and ownership are operating as intended.\n\nSupport feedback should become product input, not disappear into a separate queue forever.\n\n## 11. Your management cadence and dashboard\n\nThe following is a suggested starting cadence; adjust it to complexity and avoid duplicating meetings that already work.\n\n| Cadence | Purpose | Expected output |\n|---|---|---|\n| Team-level, daily as appropriate | Coordinate work and surface blockers | Immediate actions |\n| Cross-team, once or twice weekly | Resolve dependencies and integration issues | Owners, commitments, escalation |\n| Weekly delivery review | Review forecast, risks, scope, cost | Updated integrated outlook |\n| Every iteration | Demonstrate integrated progress and learn | Acceptance and backlog adjustments |\n| Monthly steering review | Make investment and cross-functional decisions | Recorded decisions |\n| PI boundaries | Align and inspect the broader plan | Objectives and improvement actions |\n| Release-specific | Assess readiness | Explicit release decision |\n\n### A one-page executive report\n\nInclude:\n\n1. Intended outcome and current evidence.\n2. Release forecast and confidence.\n3. Financial forecast.\n4. Top risks and issues.\n5. Dependencies requiring intervention.\n6. Decisions needed, by whom, and by when.\n\nInstead of:\n\n> “Testing is amber.”\n\nWrite:\n\n> “The planned release is at risk because policy lookup is not integrated. Recommendation: retain the initial customer segment and defer broader rollout. Decision needed from the sponsor by Friday. A two-week extension is the alternative, subject to a revised cost forecast.”\n\n### Measure more than activity\n\nUse a balanced set:\n\n| Dimension | Example |\n|---|---|\n| Business outcome | Digital completion rate; missing-information follow-up |\n| Flow | Lead time, aging work, blocked time, work in progress |\n| Predictability | Objectives achieved; forecast changes and causes |\n| Quality | Escaped defects and repeat defects |\n| Reliability | Failed transactions and service incidents |\n| Finance | Estimate at completion and operating-cost trend |\n| People | Sustained overload and critical skill concentration |\n\nAvoid letting “tickets closed” replace evidence of working, useful, supportable software.\n\n## 12. How to recover a project that is in bad shape\n\nStart with assessment, not a new promise. Effective recovery requires establishing the current state, identifying root causes, recommending changes, and securing sponsor commitment to a recovery plan.\n\nSuppose our example now has:\n\n- Substantial spending with little integrated functionality.\n- A release date six weeks away.\n- Unfinished policy integration.\n- Rising defects.\n- Business testers who are not available.\n- Team exhaustion.\n- A sponsor who still sees a green status report.\n\n### Step 1: Establish the facts\n\nCreate a short, time-boxed assessment:\n\n- What works end to end?\n- What is complete only in isolation?\n- What remains?\n- Which dependencies constrain delivery?\n- What has been spent?\n- What does the remaining work realistically cost?\n- Which controls or operational needs remain unmet?\n- Does the business case still justify continuation?\n\nReview evidence and interview the sponsor, business owners, delivery teams, and operations. Do not use a blame exercise as a substitute for diagnosis.\n\n### Step 2: Stabilize the work\n\nProposed actions:\n\n- Stop uncontrolled scope additions.\n- Give the backlog one authoritative priority order.\n- Reduce simultaneous work.\n- Resolve the highest-impact integration constraint.\n- Obtain named business-testing commitments.\n- Protect essential production support.\n- Replace activity reporting with integrated demonstrations.\n\n### Step 3: Present real options\n\n| Option | What changes | What leadership must understand |\n|---|---|---|\n| Keep the date, reduce scope | Release a smaller useful capability | Benefits arrive in stages |\n| Keep scope, extend time | Allow necessary delivery and validation | Cost and opportunity impact |\n| Add targeted expertise | Address a specific skill bottleneck | Benefit is conditional, not guaranteed |\n| Pause or stop | Avoid unjustified future investment | Existing expenditure does not justify further waste |\n\nRecovery options can include scope reduction, schedule changes, process improvement, and redefinition of objectives where necessary.\n\n### Step 4: Approve a recovery baseline\n\nRecord:\n\n- Revised business objective.\n- Retained and removed scope.\n- Delivery forecast.\n- Cost-to-complete.\n- Named dependency commitments.\n- Quality and release criteria.\n- Escalation rules.\n- Sponsor approval.\n\nDo not quietly overwrite the old baseline. Keep the history and explain why the plan changed.\n\n### Step 5: Rebuild trust with evidence\n\nUse short checkpoints:\n\n- Working integrated demonstrations.\n- Defect and blocked-work trends.\n- Dependency delivery.\n- Updated forecast.\n- Decisions completed.\n\nRecovery is not making the status green. It is making the outlook credible and the remaining investment defensible.\n\n## 13. A practical learning path for you\n\nUse the FNOL case as a simulation and produce the following artifacts. This will build practical judgment faster than studying terminology alone.\n\n| Phase | Learn | Produce |\n|---|---|---|\n| 1. Insurance and outcomes | Policy, claims, billing, FNOL, adjuster workflows | Business process map and problem statement |\n| 2. Governance | Stakeholders, authority, escalation | Stakeholder map and decision-rights register |\n| 3. Discovery | Baselines, hypotheses, options, MVP | Lean business case and scope boundaries |\n| 4. Agile delivery | Product backlogs, team planning, integration | Epic-to-feature-to-story example |\n| 5. SAFe coordination | Portfolio, ART, PI Planning, dependencies | PI objectives and dependency map |\n| 6. Financial management | Cost, capacity, forecasts, benefits | Budget and resource plan |\n| 7. Production ownership | Readiness, incidents, support | Release checklist and support model |\n| 8. Recovery | Assessment, options, rebaselining | Troubled-project recovery proposal |\n\nA manageable starter toolkit is:\n\n- One-page charter.\n- Stakeholder and decision-rights map.\n- Prioritized backlog.\n- Integrated milestone and dependency plan.\n- Risks, assumptions, issues, and dependencies log.\n- Budget and staffing forecast.\n- Decision log.\n- Release and support-readiness checklist.\n- Benefits dashboard.\n- Recovery plan when needed.\n\nThe test of effective management is whether you can answer, with evidence: What outcome are we pursuing? Who can decide? What is blocking flow? What will it cost to finish? Can we operate it safely? And what should we change when reality differs from the plan?";

ic.", "example": "Monthly portal analytics: completed eligible transactions ÷ eligible attempts.", "verify": "Analytics lead / metric owner.", "impact": "Makes results reproducible and helps avoid misleading averages."}, "status": {"meaning": "State of measurement or benefit realization, not code progress.", "example": "Baseline confirmed; Not measured; Improving; Off target.", "verify": "Benefit owner.", "impact": "Shows whether evidence supports the investment case."}}, "charter": {"item": {"meaning": "The specific charter element being approved or clarified.", "example": "In scope, Out of scope, Funding authority, Business objective.", "verify": "Project Manager and sponsor.", "impact": "Organizes the agreement about what the project is and is not authorized to do."}, "detail": {"meaning": "Clear, decision-ready statement of the charter element with boundaries.", "example": "Replace Vehicle is included; standalone Remove Vehicle is excluded from initial launch.", "verify": "Sponsor, Product Owner and subject-matter experts.", "impact": "Avoids ambiguity when a new requirement is later proposed."}, "owner": {"meaning": "Person who validates or approves this charter line, not necessarily its author.", "example": "Sponsor for scope authority; PO for backlog details.", "verify": "PMO / sponsor.", "impact": "Shows where to obtain a binding answer before baseline approval."}, "status": {"meaning": "Whether this charter element is drafted, validated, or approved.", "example": "Draft pending sponsor sign-off.", "verify": "Sponsor or delegated approver.", "impact": "Prevents an unapproved six-month target from being presented as a committed baseline."}}, "stakeholders": {"name": {"meaning": "Specific role, team or person the project depends on.", "example": "PolicyCenter transaction lead.", "verify": "PM and functional manager.", "impact": "Makes dependency and decision routing explicit."}, "role": {"meaning": "Role played in the project, not simply a job title.", "example": "Portal Product Owner; enterprise IAM program lead.", "verify": "Functional lead.", "impact": "Separates product, Scrum, engineering, PM, and program responsibilities."}, "accountability": {"meaning": "Outcome this stakeholder is responsible for delivering or assuring.", "example": "PolicyCenter lead owns endorsement API contract and readiness.", "verify": "Stakeholder being named.", "impact": "Prevents unclear ownership when a milestone slips."}, "authority": {"meaning": "Decisions the stakeholder can actually approve or escalate.", "example": "Sponsor approves scope/date tradeoff; PO orders backlog within delegation.", "verify": "PMO / sponsor / relevant authority.", "impact": "Avoids sending budget or release decisions to people without approval rights."}, "engagement": {"meaning": "How and when the PM should communicate with this stakeholder.", "example": "Weekly dependency review; monthly steering meeting.", "verify": "Stakeholder / PM.", "impact": "Sets a purposeful cadence rather than adding unnecessary ceremonies."}, "status": {"meaning": "Current engagement or decision-readiness level.", "example": "Engaged; Awaiting confirmation; Escalation needed.", "verify": "PM after direct contact.", "impact": "Reveals absent decision-makers or commitment gaps."}}, "roadmap": {"milestone": {"meaning": "Verifiable integrated delivery outcome across teams, not a sprint task.", "example": "PolicyCenter contract approved for Add/Replace transactions.", "verify": "PO, architect, delivery leads.", "impact": "Used to test whether the overall release forecast is credible."}, "owner": {"meaning": "Single named lead accountable for evidence that this milestone is met.", "example": "PolicyCenter technical lead for transaction API readiness.", "verify": "Producing team / functional manager.", "impact": "Makes follow-up and escalation traceable."}, "baseline": {"meaning": "Original approved milestone date retained for change history.", "example": "2027-03-01 for integration con en an insured vehicle is replaced.", "verify": "Product Owner and team.", "impact": "Connects sprint work to the customer journey and release scope."}, "owner": {"meaning": "Person or team accountable for coordinating this backlog item; Jira assignee conventions vary.", "example": "PolicyCenter lead for premium calculation feature.", "verify": "Product Owner / technical lead.", "impact": "Provides a contact for estimates, blockers and evidence."}, "pi": {"meaning": "Planning Interval (PI) in which the feature is forecast or committed at ART level.", "example": "PI-1 for initial vehicle-change functionality.", "verify": "ART / Product management and teams.", "impact": "Aligns the feature with broader integrated planning, if the organization uses SAFe."}, "sprint": {"meaning": "Iteration currently forecast for the work; this can change through team planning.", "example": "Sprint 4 for Replace Vehicle calculation.", "verify": "Scrum team / Product Owner.", "impact": "Helps forecast feature readiness without directing the team’s Sprint Planning."}, "points": {"meaning": "Team-relative story-point estimate; not a universal measure of hours or performance.", "example": "8 points estimated by the team for a feature slice.", "verify": "Developers / Agile team.", "impact": "Provides local forecasting input; never add points across unrelated teams as standardized effort."}, "status": {"meaning": "Current workflow state in the team’s configured Jira process.", "example": "Ready, In progress, Blocked, In review, Done.", "verify": "Team / Product Owner.", "impact": "Shows delivery progress, but Done stories alone do not prove the release is ready."}, "acceptance": {"meaning": "Testable condition that demonstrates the intended capability works.", "example": "Replacement premium and effective date agree with PolicyCenter policy record.", "verify": "Product Owner / QA / business SME.", "impact": "Links requirements to demonstrable, accepted functionality."}}, "iterations": {"iterat s.", "impact": "You cannot allocate all 92 days to development; evaluate skills and independently committed time."}, "assignedPeople": {"meaning": "Total people entered on team-capacity lines, not necessarily unique individuals or full-time equivalents.", "example": "8 portal developers plus 4 portal QA engineers.", "verify": "Engineering and QA managers", "impact": "Use skill and allocation detail rather than treating raw headcount as productivity."}, "supportDays": {"meaning": "Team person-days reserved to keep live customer portal operations running.", "example": "8 QA days reserved for production defects and regressions during the sprint.", "verify": "Service owner and functional managers", "impact": "Prevents promising full-team capacity to Add/Replace Vehicle while production continues."}, "nonFeatureDays": {"meaning": "Total team person-days reserved for leave and other activities, such as Okta integration work.", "example": "4 QA leave days plus 6 Okta regression days.", "verify": "Team leads and resource managers", "impact": "Avoid double subtraction when the same activity is recorded in another category."}, "plannedTests": {"meaning": "Aggregate planned test cases across recorded QA scenarios; only meaningful if all rows use the same counting basis.", "example": "20 planned Replace Vehicle effective-date cases.", "verify": "QA Lead", "impact": "Tracks expected coverage; does not by itself indicate readiness."}, "passedTests": {"meaning": "QA executions recorded as passed on the tested build/environment.", "example": "18 passed E2E cases with Guidewire policy transaction checks.", "verify": "QA Lead", "impact": "Use associated defect and backend evidence before claiming functional readiness."}, "failedTests": {"meaning": "Executions with a deviation from expected results.", "example": "2 tests fail because policy effective date is incorrect.", "verify": "QA Lead and engineering defect owners", "impact": "A single critical failure may block release regardless of overall pass rate."}, "blockedTests": {"meaning": "Test cases unable to run because of missing data, environment, credentials or dependent functionality.", "example": "3 E2E tests waiting for a PolicyCenter test endpoint.", "verify": "QA Lead and dependency owner", "impact": "Make the external dependency and unblock date explicit."}, "workingTime": {"meaning": "Sum of active processing time across the modeled value stream steps, expressed in elapsed days.", "example": "0.02 days to process policy eligibility lookup.", "verify": "Business operations and process owners", "impact": "Compare actual work time with waiting time; this is not a staff-effort total."}, "waitingTime": {"meaning": "Sum of elapsed time between work steps, including handoff queues and approvals.", "example": "1.5 days waiting for an external policy service response.", "verify": "Business operations and technology leads", "impact": "Often reveals bottlenecks that sprint velocity does not capture."}, "elapsedTime": {"meaning": "Total modeled lead time: working time plus waiting time.", "example": "2.0 working days + 5.0 waiting days = 7.0 days end-to-end.", "verify": "Process/value-stream owner", "impact": "Use a consistent start and end boundary when comparing changes."}, "flowEfficiency": {"meaning": "Working time divided by total elapsed time, expressed as a percentage.", "example": "2 working days / 7 elapsed days = 28.6% flow efficiency.", "verify": "Transformation lead and operations analyst", "impact": "Shows where queue reduction might matter more than individual team throughput."}}};
/* v1.4 live, non-destructive internal-consistency checks. Risk flags are not data-entry errors. */
const dateVal=s=>{if(typeof s!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s))return NaN;const n=Date.parse(s+'T12:00:00Z');return Number.isFinite(n)&&new Date(n).toISOString().slice(0,10)===s?n:NaN};
const safeN=x=>{if(x===null||x===undefined||String(x).trim()==='')return NaN;const n=Number(x);return Number.isFinite(n)?n:NaN};
const isResolved=s=>/^(complete|completed|done|closed|approved|accepted|validated|resolved|passed)$/i.test(String(s||''));
const availableDays=r=>safeN(r.people)*safeN(r.daysPerPerson)-safeN(r.leave)-safeN(r.support)-safeN(r.other);
const budgetBreakdown=()=>{const R=rows('financials'),res=R.filter(r=>/contingency reserve/i.test(String(r.category||''))),base=R.filter(r=>!/contingency reserve/i.test(String(r.category||''))),sumField=(items,key)=>items.reduce((n,r)=>n+(Number(r[key])||0),0),budget=sumField(R,'baseline'),baseBudget=sumField(base,'baseline'),reserve=sumField(res,'baseline'),actual=sumField(R,'actual'),etc=sumField(R,'etc'),eac=actual+etc,draw=Math.max(0,eac-baseBudget);return {budget,baseBudget,reserve,actual,etc,eac,draw,remaining:Math.max(0,reserve-draw),commitments:sumField(R,'commitments')}};
function auditWorkspace(){
 const items=[],push=(severity,module,code,message)=>items.push({severity,module,code,message});
 const md=state.metadata,asof=dateVal(md.asOfDate),start=dateVal(md.projectStart),target=dateVal(md.targetRelease);
 for(const key of ['asOfDate','projectStart','targetRelease'])if(!Number.isFinite(dateVal(md[key])))push('Error','audit','DATE-'+key,`Workspace ${key} is not a valid ISO date (YYYY-MM-DD).`);
 if(Number.isFinite(asof)&&Number.isFinite(start)&&asof<start&&rows('financials').some(r=>safeN(r.actual)>0))push('Error','financials','FIN-CHRONO','Actual project spending is recorded before the defined project start; verify the snapshot date or cost attribution.');
 const fin=budgetBreakdown();
 for(const [i,r] of rows('financials').entries()){
  for(const fld of ['baseline','actual','etc','commitments']){
   const val=safeN(r[fld]);if(!Number.isFinite(val)||val<0)push('Error','financials','FIN-NUM-'+i+'-'+fld,`${r.category||'Cost category '+(i+1)}: ${fld} must be a nonnegative amount.`);
  }
  if(Number.isFinite(safeN(r.commitments))&&Number.isFinite(safeN(r.etc))&&safeN(r.commitments)>safeN(r.etc))push('Error','financials','FIN-COMMIT-'+i,`${r.category}: commitments exceed ETC. In this model commitments are a subset of future ETC, not an amount added to EAC.`);
  if(/contingency reserve/i.test(String(r.category||''))&&(safeN(r.actual)>0||safeN(r.etc)>0))push('Review','financials','FIN-RESERVE','Contingency is shown as a funding reserve. Charge costs to cost categories and track authorized reserve draw separately.');
 }
 if(Math.abs(fin.budget-safeN(md.budget))>0.005)push('Error','financials','FIN-BASELINE',`Finance baseline ${money(fin.budget)} differs from workspace budget ${money(md.budget)}; budget should be derived from finance register.`);
 if(fin.eac>fin.budget)push('Review','financials','FIN-OVERRUN',`Forecast ${money(fin.eac)} exceeds authorized ${money(fin.budget)} by ${money(fin.eac-fin.budget)}. Prepare funding/scope decision.`);
 else if(fin.eac>fin.baseBudget)push('Review','financials','FIN-RESERVE-USE',`Forecast is ${money(fin.eac-fin.baseBudget)} above base costs and uses that amount of the ${money(fin.reserve)} contingency. Validate assumptions and authorization.`);
 const caps=rows('capacity');for(const [i,r] of caps.entries()){
  for(const k of ['people','daysPerPerson','leave','support','other'])if(!Number.isFinite(safeN(r[k]))||safeN(r[k])<0)push('Error','capacity','CAP-NUM-'+i+'-'+k,`${r.team}: ${k} must be a nonnegative number.`);
  const calc=availableDays(r),saved=safeN(r.available);
  if(!Number.isFinite(calc))continue;
  if(calc<0)push('Error','capacity','CAP-NEG-'+i,`${r.team}: reservations (${safeN(r.leave)+safeN(r.support)+safeN(r.other)}d) exceed gross capacity (${safeN(r.people)*safeN(r.daysPerPerson)}d).`);
  if(!Number.isFinite(saved)||Math.abs(saved-calc)>0.0001)push('Error','capacity','CAP-STALE-'+i,`${r.team}: stored available ${r.available}d differs from calculated ${calc}d. Save or normalize the row.`);
 }
 const itr=rows('iterations'),pi=itr.find(r=>r.iteration==='PI-1'),sprints=itr.filter(r=>/^S[1-4]$/.test(String(r.iteration||'')));
 for(const [i,r] of itr.entries()){
  for(const f of ['capacity','planned','done'])if(!Number.isFinite(safeN(r[f]))||safeN(r[f])<0)push('Error','iterations','SPR-NUM-'+i+'-'+f,`${r.iteration}: ${f} must be a nonnegative relative planning-point value.`);
  if(safeN(r.done)>safeN(r.planned))push('Error','iterations','SPR-DONE-'+i,`${r.iteration}: completed effort exceeds planned effort; confirm whether the plan was reforecast.`);
  if(safeN(r.planned)>safeN(r.capacity))push('Review','iterations','SPR-OVER-'+i,`${r.iteration}: planned ${r.planned} points exceed team forecast capacity ${r.capacity}; revisit sprint commitment.`);
 }
 if(pi&&sprints.length===4)for(const f of ['capacity','planned','done']){
  const total=sprints.reduce((a,r)=>a+(safeN(r[f])||0),0);
  if(Math.abs(total-safeN(pi[f]))>0.0001)push('Error','iterations','PI-ROLLUP-'+f,`PI-1 ${f}=${pi[f]} but S1–S4 totals ${total} (${f} uses relative planning points).`);
 }
 const milestones=rows('roadmap');for(const [i,r] of milestones.entries()){
  const a=dateVal(r.baseline),b=dateVal(r.forecast);
  if(!Number.isFinite(a)||!Number.isFinite(b))push('Error','roadmap','ROAD-DATE-'+i,`${r.milestone}: baseline and forecast must be valid dates.`);
  if(Number.isFinite(asof)&&Number.isFinite(b)&&b<asof&&!isResolved(r.status))push('Review','roadmap','ROAD-OVERDUE-'+i,`${r.milestone}: forecast date passed but status is ${r.status}; verify current estimate and evidence.`);
  if(Number.isFinite(a)&&Number.isFinite(b)&&b>a&&/^(green|on track|complete)$/i.test(String(r.status)))push('Error','roadmap','ROAD-STATUS-'+i,`${r.milestone}: milestone slips after baseline yet is marked ${r.status}.`);
 }
 const go=milestones.find(r=>/Release Go\/No-Go/i.test(r.milestone));if(go&&Number.isFinite(target)&&Number.isFinite(dateVal(go.baseline))&&dateVal(go.baseline)!==target)push('Review','roadmap','ROAD-TARGET',`Workspace target release ${md.targetRelease} differs from original baseline Go/No-Go ${go.baseline}. Keep approved baseline history explicit.`);
 for(const [i,r] of rows('dependencies').entries()){
  const due=dateVal(r.neededBy),fore=dateVal(r.forecast),esc=dateVal(r.escalate);
  if(![due,fore,esc].every(Number.isFinite))push('Error','dependencies','DEP-DATE-'+i,`${r.deliverable}: needed-by, forecast and escalation dates must be valid ISO dates.`);
  if(Number.isFinite(due)&&Number.isFinite(fore)&&fore>due){
   if(/^(green|on track|complete|done)$/i.test(r.status))push('Error','dependencies','DEP-STATUS-'+i,`${r.deliverable}: forecast misses needed-by date yet is green/complete.`);
   else push('Review','dependencies','DEP-SLIP-'+i,`${r.deliverable}: forecast ${r.forecast} is later than needed-by ${r.neededBy}; agree mitigation or revised integration forecast.`);
  }
  if(Number.isFinite(asof)&&Number.isFinite(esc)&&esc<asof&&!isResolved(r.status))push('Review','dependencies','DEP-ESCALATION-'+i,`${r.deliverable}: escalation date ${r.escalate} passed without a resolved status.`);
 }
 for(const [i,r] of rows('quality').entries()){
  for(const f of ['planned','passed','failed','blocked'])if(!Number.isFinite(safeN(r[f]))||safeN(r[f])<0||!Number.isInteger(safeN(r[f])))push('Error','quality','QA-NUM-'+i+'-'+f,`${r.scenario}: ${f} must be a nonnegative whole test count.`);
  if(['planned','passed','failed','blocked'].every(f=>Number.isFinite(safeN(r[f])))&&safeN(r.passed)+safeN(r.failed)+safeN(r.blocked)>safeN(r.planned))push('Error','quality','QA-EXCEED-'+i,`${r.scenario}: passed + failed + blocked exceed planned tests.`);
 }
 for(const [i,r] of rows('release').entries()){
  const due=dateVal(r.due);if(!Number.isFinite(due))push('Error','release','REL-DATE-'+i,`${r.gate}: invalid due date.`);
  if(Number.isFinite(asof)&&Number.isFinite(due)&&due<asof&&!isResolved(r.status))push('Review','release','REL-OVERDUE-'+i,`${r.gate}: readiness item overdue with status ${r.status}.`);
 }
 for(const [i,r] of rows('safelp').entries()){
  for(const f of ['businessValue','timeCriticality','riskReduction','jobSize'])if(!Number.isFinite(safeN(r[f]))||safeN(r[f])<0)push('Error','safelp','WSJF-NUM-'+i+'-'+f,`${r.epic}: ${f} must be a nonnegative relative score.`);
  if(safeN(r.jobSize)===0)push('Error','safelp','WSJF-ZERO-'+i,`${r.epic}: job size must be greater than zero; WSJF cannot silently divide by one.`);
 }
 for(const [i,r] of rows('value').entries())for(const f of ['workingDays','waitingDays'])if(!Number.isFinite(safeN(r[f]))||safeN(r[f])<0)push('Error','value','VALUE-NUM-'+i+'-'+f,`${r.stage}: ${f} must be a nonnegative business-day value.`);
 for(const id of ['backlog','raid','changes','decisions']){
  const key=id==='backlog'?'key':'id',seen=new Set();for(const [i,r] of rows(id).entries()){
   const value=String(r[key]||'').trim();if(!value)push('Error',id,'KEY-MISSING-'+i,`${id} row ${i+1}: missing ${key}.`);
   else if(seen.has(value))push('Error',id,'KEY-DUP-'+i,`${id}: duplicate identifier ${value}.`);
   seen.add(value);

function validateEditedRecord(section,data,editingIndex){
 const errors=[];
 const numeric=({financials:['baseline','actual','etc','commitments'],capacity:['people','daysPerPerson','leave','support','other'],iterations:['capacity','planned','done'],quality:['planned','passed','failed','blocked'],changes:['cost','days'],safelp:['businessValue','timeCriticality','riskReduction','jobSize'],value:['workingDays','waitingDays']})[section]||[];
 const dates=({roadmap:['baseline','forecast'],dependencies:['neededBy','forecast','escalate'],raid:['due'],decisions:['due'],release:['due'],recovery:['due'],vendors:['due'],program:['baseline','forecast']})[section]||[];
 for(const field of numeric){let val=safeN(data[field]);if(!Number.isFinite(val)||val<0)errors.push(`${field}: enter a nonnegative number`)}
 for(const field of dates)if(!Number.isFinite(dateVal(data[field])))errors.push(`${field}: enter a valid date`);
 if(section==='capacity'&&Number.isFinite(availableDays(data))&&availableDays(data)<0)errors.push('leave: non-delivery commitments exceed available gross person-days');
 if(section==='financials'&&safeN(data.commitments)>safeN(data.etc))errors.push('commitments: committed future costs must be included within ETC');
 if(section==='quality'&&numeric.every(k=>Number.isFinite(safeN(data[k])))&&safeN(data.passed)+safeN(data.failed)+safeN(data.blocked)>safeN(data.planned))errors.push('planned: combined passed, failed and blocked tests exceed planned');
 if(section==='iterations'&&safeN(data.done)>safeN(data.planned))errors.push('done: completed planning points exceed the planned value');
 if(section==='safelp'&&safeN(data.jobSize)<=0)errors.push('jobSize: job size must be positive');
 const uniqueKey=section==='backlog'?'key':['raid','changes','decisions'].includes(section)?'id':null;
 if(uniqueKey){let v=String(data[uniqueKey]||'').trim();if(!v)errors.push(`${uniqueKey}: record identifier is required`);
  else if(rows(section).some((r,i)=>i!==editingIndex&&r[uniqueKey]===v))errors.push(`${uniqueKey}: identifier already exists`);
 }
 if(!String(data[Object.keys(data)[0]]??'').trim())errors.push(`${Object.keys(data)[0]}: record name is required`);
 return errors;
}

m(tab,'planned'),pass=sum(tab,'passed'),fail=sum(tab,'failed'),block=sum(tab,'blocked');return `<div class="cards"><div class="metric"><label>Planned tests ${fieldHelpButton('plannedTests','__metrics__')}</label><div class="number">${planned}</div></div><div class="metric"><label>Passed ${fieldHelpButton('passedTests','__metrics__')}</label><div class="number">${pass}</div></div><div class="metric"><label>Failed ${fieldHelpButton('failedTests','__metrics__')}</label><div class="number">${fail}</div></div><div class="metric"><label>Blocked ${fieldHelpButton('blockedTests','__metrics__')}</label><div class="number">${block}</div></div></div>`}if(tab==='safelp'){return `<div class="help"><strong>Optional WSJF practice:</strong> WSJF = (Business Value + Time Criticality + Risk Reduction / Opportunity Enablement) ÷ Job Size. All values here are illustrative relative estimates, not monetary estimates. ${rows('safelp').map(x=>`${esc(x.epic)}: ${num(x.jobSize)>0?((num(x.businessValue)+num(x.timeCriticality)+num(x.riskReduction))/num(x.jobSize)).toFixed(2):'Invalid job size'}`).join(' · ')}</div>`}if(tab==='value'){let working=sum(tab,'workingDays'),waiting=sum(tab,'waitingDays');return `<div class="cards"><div class="metric"><label>Active working time ${fieldHelpButton('workingTime','__metrics__')}</label><div class="number">${working.toFixed(2)}d</div></div><div class="metric"><label>Queue / waiting time ${fieldHelpButton('waitingTime','__metrics__')}</label><div class="number">${waiting.toFixed(2)}d</div></div><div class="metric"><label>Total elapsed model ${fieldHelpButton('elapsedTime','__metrics__')}</label><div class="number">${(working+waiting).toFixed(2)}d</div></div><div class="metric"><label>Flow efficiency ${fieldHelpButton('flowEfficiency','__metrics__')}</label><div class="number">${working+waiting?(100*working/(working+waiting)).toFixed(1):0}%</div></div></div>`}return ''}
function sectionDetails(){let h={
'intake':['Investment versus delivery','The intake path is problem → discovery → lean business case → approval → delivery. Not every product request becomes a program epic. Use a portfolio authority for investment approvals.'],
'business':['Measure the benefit','Distinguish baseline, target and actual. Policy servicing adoption, assisted service effort and reliable transactions are different metrics. Assign long-term ownership beyond project closure.'],
'charter':['What approval means','A charter defines initial objectives, boundaries, sponsor, constraints and authority. Validate a proposed six-month launch before promising a firm baseline.'],
'stakeholders':['Practical governance','PO can ask business stakeholders for requirements directly. PM does not insert itself into every question. PM handles integrated delivery commitments and escalations outside team authority.'],
'roadmap':['The integrated plan','This plan captures milestone-level commitments and dependencies; the Scrum backlog holds stories. Maintain baseline and current forecast separately.'],
'backlog':['Jira ownership','Epics/features/stories and estimates are owned by product and delivery teams; PM reviews evidence and blockers. A green sprint does not guarantee an on-time integrated release.'],
'iterations':['PI planning vs sprints','The capacity/planned/done values in this register are relative planning points across one sample team. They are NOT the person-days shown in Resource Capacity and cannot be converted 1:1. PI-1 rolls up S1–S4.'],
'dependencies':['Make handoffs testable','A dependency is not merely a label. Record what must be delivered, by whom, when it is needed, what evidence proves readiness, and the impact if late.'],
'capacity':['Compute usable capacity','For each team: (people × working days) − leave − production support − other commitments. This is a rough planning estimate; validate with historical throughput and skill mix.'],
'financials':['Financial interpretation','Base costs = $1.05M; authorized contingency = $150k; EAC = $1.065M, so expected contingency draw = $15k, remaining = $135k. Contractual commitments are included in ETC, not added twice. Calculated values update when you edit financial records.'],
'raid':['Four different registers','Risk may happen; issue already happened; assumption needs validation; dependency is required input/commitment. Each needs owner, due date and next action.'],
'changes':['Baseline vs product backlog','Backlog reprioritization can happen continuously within delegated scope. A request changing the approved launch, budget or material scope needs impact analysis and authorization.'],
'decisions':['PM escalation pattern','State decision needed, alternatives, consequences, recommendation, accountable authority and deadline. Never just forward an unresolved problem upward.'],
'quality':['QA management versus PM','This is the FORMAL integration/E2E/security/UAT release-test sample, not all story-level QA. Earlier sprint work was tested under the team Definition of Done in Jira. The QA Lead manages testing and evidence; PM integrates the testing milestone into release governance.'],
'release':['Deployment is not customer release','A production deployment can precede customer exposure if the architecture supports flags or staged rollout. Release authority must be explicitly named.'],
'operations':['Business recovery','If a completed policy update is wrong, rolling back code may not fix the policy record. Operations and PC teams need exception handling and reconciliation.'],
'vendors':['Vendor management','Track SOW, deliverable, due date, evidence, contract owner, risks and financial impact. Procurement/vendor manager handles contractual controls as delegated.'],
'compliance':['No assumed regulatory rule','Determine applicable state, product, privacy and security requirements with compliance and business owners. This module is a question set, not legal advice.'],
'reports':['Evidence-based RAG','RAG must reflect forecast and agreed tolerances. A delayed backend can make a project Amber/Red even when team velocity looks healthy.'],
'recovery':['Protect original baseline','Diagnose current integrated state; stabilize work; evaluate scope/date/cost options; secure authority; preserve baseline history and monitor recovery evidence.'],
'program':['Program versus project','Several integrated teams on one portal release can still be one project. Several related projects under shared benefit objectives may form a program.'],
'safelp':['Value-stream funding','Portfolio Kanban, strategic themes, lean budgets, capacity, ART and PI alignment work together. WSJF is a prioritization heuristic, not an automatic funding decision.'],
'value':['Operational vs development flow','These records model the CURRENT assisted/manual vehicle-servicing process, before the future self-service capability launches. Use an 8-hour business-day equivalent for both active and waiting duration; do not confuse agent handling time with total elapsed process duration.'],
'adoption':['Measure adoption','Training completed is a leading indicator, not proof of behavior change. Check actual use, feedback, exceptions, leadership support and sustained outcomes.'],
'closure':['Closure does not end outcomes','Project closure can finish after handover, financial reconciliation and acceptance. Business outcome owner continues measuring realized benefits.'],
};let x=h[tab]||['Practice','Review the corresponding artifact, distinguish decision rights, and connect delivery evidence to business results.'];return `<section class="panel"><h2>${x[0]}</h2><div class="notes">${x[1]}</div>${tab==='roadmap'?`<p class="muted">Add/Replace Vehicle is an enhancement to an existing portal. Other enterprise programs, including Okta, independently affect this project and must be represented as external dependencies.</p>`:''}</section>`}

const scenarios=[
{short:'Deadline',category:'Initiation',name:'Sponsor mandates six months',prompt:'Sponsor says Add/Replace Vehicle must launch in six months. Product Owner has not finished backlog discovery, PolicyCenter dates are uncertain and Okta rollout will absorb shared capacity.',response:'Treat six months as a business target, not a committed baseline. Ask PO and leads for minimal viable scope, rough sizing, skill capacity, integration contracts and risk. Present a range or conditional forecast with constraints. Seek sponsor agreement on scope/date tradeoffs and establish decision rights before publishing baseline.',avoid:'Promising the date without a validated forecast; taking over PO story estimation.'},
{short:'PolicyCenter',category:'Dependencies',name:'Backend integration slips three weeks',prompt:'Portal team finishes stories but PolicyCenter Replace Vehicle API is late. SIT starts in two weeks. Business insists release date stays unchanged.',response:'Confirm producer date and deliverable evidence; evaluate impact on E2E, UAT and release with QA/architect/PO. Compare resequencing, earlier contract testing, scoped release or schedule extension. Record forecast, risks, decision authority and escalation. Do not declare Green just because sprints completed.',avoid:'Blaming another team; forcing QA to skip safeguards; inventing recovery without evidence.'},
{short:'Okta',category:'Capacity',name:'Enterprise Okta rollout takes shared capacity',prompt:'The enterprise identity program requires portal authentication regression and developer support during the same PI as Add/Replace Vehicle.',response:'Ask IAM lead for integration scope, due dates and release controls; ask portal functional leads for realistic capacity with BAU reserved. Determine critical path and conflicts. Coordinate PM/PO and enterprise program priorities, then seek an authorized decision on staffing, scope, sequence or release date.',avoid:'Automatically overruling enterprise program priorities; double-counting team capacity.'},
{short:'Funding',category:'Financials',name:'Forecast exceeds approved budget',prompt:'Approved budget is $1.2M. Actual cost is $500k and ETC is $800k. Sponsor has not approved more funding.',response:'Calculate EAC $1.3M and variance +$100k. Validate ETC with leads and Finance; identify what drove the change and remaining contractual commitments. Prepare options (scope reduction, timeline, targeted resources, contingency if authorized), impact and recommendation. Seek approval before changing the baseline.',avoid:'Saying under budget because only $500k has been spent; using contingency without proper authority.'},
{short:'New scope',category:'Change control',name:'Business adds stand-alone Remove Vehicle',prompt:'PO asks to include vehicle removal in the same release. It requires PC rules and extra testing.',response:'PO can refine/prioritize backlog within delegated authority; evaluate whether this changes approved business scope, cost, release or compliance. Obtain joint estimates and risk assessment. Route a material baseline change for sponsor/change authority approval; preserve original baseline and log decision.',avoid:'Blocking any backlog change; allowing unapproved material scope expansion.'},
{short:'Defects',category:'Quality',name:'QA finds a major policy record defect',prompt:'During E2E, a Replace Vehicle transaction updates the wrong effective date. Developers have a fix but production release is scheduled tomorrow.',response:'Coordinate technical root cause and affected policy records; have QA validate repair and regression; ask business, compliance and release authorities to assess customer and regulatory consequence. Update release readiness and recommend no-go/conditional decision based on documented criteria. Validate business data recovery, not only code rollback.',avoid:'Unilaterally overruling release controls; equating code rollback with policy correction.'},
{short:'Recovery',category:'Recovery',name:'Six weeks before release, integrated work is incomplete',prompt:'Teams report green sprints, but PolicyCenter E2E is failing, business UAT resources are unavailable and project EAC is rising.',response:'Establish evidence-based integrated state and critical path; stabilize WIP, confirm dependencies and resources, build recovery options with scope/date/cost/quality tradeoffs. Report RAG honestly, obtain sponsor decision and approval for rebaseline, then monitor short evidence-based checkpoints.',avoid:'Changing dates quietly; measuring tickets instead of working solution.'},
{short:'Program',category:'Program management',name:'Three projects need one PolicyCenter specialist',prompt:'Add/Replace Vehicle, billing self-service and document modernization each expect the same PolicyCenter resource in the next month.',response:'Identify demand and capacity for the specific skill; show milestone impacts for all projects and overall program benefits. Facilitate a decision by the authorized resource/portfolio owners on priorities, sequencing, targeted reinforcement or scope. Update all PM forecasts and dependent commitments.',avoid:'Treating multiple teams as automatically a program; allocating resources without authority.'},
{short:'LPM',category:'Lean portfolio',name:'Leadership wants value stream funding',prompt:'The organization funds a long list of projects, but leadership wants persistent value streams and shorter delays from customer request to policy change.',response:'Map operational and development value streams, identify products and long-lived teams, current funding rules and bottlenecks. Work with portfolio and business leadership on strategic priorities, capacity, value metrics, guardrails and staged transition. Pilot without assuming that ceremonies or reporting alone transform delivery.',avoid:'Calling every department a value stream; promising savings without baseline measurement.'},
{short:'Release',category:'Operations',name:'Code deployed, transaction failures appear',prompt:'Release is deployed but customers see policy update errors; some transactions may already have changed backend policy records.',response:'Coordinate incident command/service owner and business controls; pause customer exposure or use approved rollback procedures if appropriate. Verify policy-record reconciliation, customer communication and manual remediation. Preserve evidence, forecast impact and reassess hypercare exit conditions.',avoid:'Assuming software rollback reverses completed policy transactions.'},

orkspace with illustrative records. It is not a certified SAFe implementation, enterprise workflow engine, multi-user database or live Jira/Confluence connector. Organizational roles, standards and approvals vary.</div></div>`}

'use strict';

const LIVE_INDEX = STORE + ':workspaces';
function readLiveIndex() {
  try { return JSON.parse(getStored(LIVE_INDEX)) || []; }
  catch { return []; }
}
function activeWorkspace() {
  return readLiveIndex().find(record => record.id === workspaceId);
}
function workspacePicker() {
  const records = readLiveIndex();
  return `<div class="toolbar workspace-picker"><select class="select" id="workspacePicker" aria-label="Active workspace"><option value="">Training workspace</option>${records.map(r => `<option value="${esc(r.id)}" ${r.id === workspaceId ? 'selected' : ''}>${esc(r.program ? r.program + ' / ' : '')}${esc(r.name)}</option>`).join('')}</select>${btn('＋ Add project or initiative','createWorkspace')}</div>`;
}
function switchWorkspace(id) {
  const next = loadWorkspace(id);
  if (id && !next) { toast('Workspace could not be opened.'); main(); return; }
  workspaceId = id;
  state = next || deep(window.STARTER);
  try { localStorage.setItem(LIVE_INDEX + ':active', id); } catch {}
  tab = 'overview';
  mode = 'project';
  filter = '';
  closeModal();
  main();
}
function openWorkspaceForm() {
  const programs = [...new Set(readLiveIndex().map(r => r.program).filter(Boolean))];
  $('#modal').innerHTML = `<div class="modal" id="modalBg"><form class="dialog" id="newWorkspace" role="dialog" aria-modal="true" aria-labelledby="newWorkspaceTitle">
    <div class="dialog-header"><h2 id="newWorkspaceTitle">Add project or initiative</h2><button type="button" class="btn" data-action="close" aria-label="Close">✕</button></div>
    <div class="dialog-body"><div class="formgrid">
      <label>Type<select class="field" name="kind"><option value="project">Standalone project</option><option value="initiative">Program initiative</option></select></label>
      <label id="programField" hidden>Parent program<input class="field" name="program" list="workspacePrograms" maxlength="100" disabled><datalist id="workspacePrograms">${programs.map(name => `<option value="${esc(name)}"></option>`).join('')}</datalist></label>
      <label>Name<input class="field" name="name" required maxlength="100"></label>
      <label>Owner<input class="field" name="owner" required maxlength="100"></label>
      <label>Sponsor<input class="field" name="sponsor" required maxlength="100"></label>
      <label>Target release<input class="field" name="target" type="date" required></label>
      <label>Business objective<textarea class="field" name="objective" required maxlength="1000"></textarea></label>
    </div><p class="hint" id="workspaceError" role="alert"></p></div>
    <div class="dialog-footer"><span></span><button type="submit" class="btn primary">Create workspace</button></div>
  </form></div>`;
  const form = $('#newWorkspace');
  form.elements.name.focus();
  form.elements.kind.addEventListener('change', () => {
    const initiative = form.elements.kind.value === 'initiative';
    $('#programField').hidden = !initiative;
    form.elements.program.required = initiative;
    form.elements.program.disabled = !initiative;
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    const input = Object.fromEntries([...new FormData(form)].map(([key, value]) => [key, value.trim()]));
    const error = $('#workspaceError');
    const today = new Date().toLocaleDateString('en-CA');
    if (!['name','owner','sponsor','objective','target'].every(key => input[key]) || (input.kind === 'initiative' && !input.program)) {
      error.textContent = 'Complete all required fields.'; return;
    }
    if (input.target < today) { error.textContent = 'Choose a target release on or after today.'; return; }
    const records = readLiveIndex();
    const program = records.find(r => r.program && r.program.toLowerCase() === input.program?.toLowerCase())?.program || input.program || '';
    const id = crypto.randomUUID();
    const record = {id, name: input.name, owner: input.owner, program};
    const initial = {
      metadata: {case: input.name, portfolio: program, industry: '', projectStart: today, asOfDate: today, targetRelease: input.target, budget: 0, illustrative: false},
      modules: Object.fromEntries(Object.keys(window.STARTER.modules).map(key => [key, []]))
    };
    initial.modules.intake.push({title: input.name, type: program ? 'Program initiative' : 'Standalone project', sponsor: input.sponsor, value: input.objective, priority: '', status: 'Open', decision: ''});
    initial.modules.charter.push({item: 'Business objective', detail: input.objective, owner: input.owner, status: 'Draft'});
    try {
      localStorage.setItem(STORE + ':' + id, JSON.stringify(initial));
      try { localStorage.setItem(LIVE_INDEX, JSON.stringify([...records, record])); }
      catch (err) { localStorage.removeItem(STORE + ':' + id); throw err; }
    } catch { error.textContent = 'Browser storage is unavailable. The workspace could not be created.'; return; }
    switchWorkspace(id);
  });
}

function deliverySnapshot(workspace) {
  const m = workspace.modules;
  const open = list => list.filter(r => !isResolved(r.status));
  const dependencies = open(m.dependencies);
  const late = dependencies.filter(r => dateVal(r.forecast) > dateVal(r.neededBy) || /blocked|red|at risk|delayed/i.test(r.status));
  const milestones = m.roadmap.map(row => {
    if (isResolved(row.status)) return row;
    const linked = late.filter(dep => String(dep.deliverable || '').trim().toLowerCase() === String(row.dependency || '').trim().toLowerCase());
    if (!linked.length) return row;
    const forecast = [row.forecast, ...linked.map(dep => dep.forecast)].filter(date => Number.isFinite(dateVal(date))).sort().at(-1) || row.forecast;
    return {...row, forecast, status: 'At risk'};
  });
  const closed = m.closure.length > 0 && open(m.closure).length === 0;
  const report = [...m.reports].sort((a,b) => String(b.period).localeCompare(String(a.period)))[0];
  const blocked = [...late, ...open(m.raid), ...open(milestones)].some(r => bad(r.status));
  const health = closed ? 'Closed' : blocked || report?.overall === 'Red' ? 'Red' : late.length || report?.overall === 'Amber' ? 'Amber' : report?.overall || 'Not assessed';
  const forecast = milestones.map(r => r.forecast).filter(date => Number.isFinite(dateVal(date))).sort().at(-1) || workspace.metadata.targetRelease;
  const stage = closed ? 'Closed' : m.closure.length ? 'Closure' : m.release.length || m.operations.length ? 'Release & operations' : m.backlog.length || m.quality.length ? 'Delivery' : m.roadmap.length || m.financials.length ? 'Planning' : 'Intake';
  return {late, milestones, health, forecast, stage, closed, decisions: open(m.decisions), risks: open(m.raid)};
}
