name: Insurance Stakeholder QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stakeholder-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project-Program-Manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q test_insurance_server.py --junitxml=stakeholder-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stakeholder-api-results
          path: Project-Program-Manager/stakeholder-results.xml
