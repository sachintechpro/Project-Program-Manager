name: Project Manager Browser and Contextual QA
on:
  push:
    branches: [main]
    paths:
      - "Project-Program-Manager/**"
      - ".github/workflows/browser-qa.yml"
  pull_request:
  workflow_dispatch:
jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser automation
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run responsive governance and contextual chat checks
        run: python Project-Program-Manager/test_chat.py
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-manager-browser-evidence
          path: Project-Program-Manager/chat-preview-*.png
          if-no-files-found: warn
