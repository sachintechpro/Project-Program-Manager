name: Apply 29-role ValueOps access audit
on:
  push:
    branches: [ternstone-valueops-deploy]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply verified role and interface updates
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf ternstone-runtime.tar.xz
          python - <<'PY'
          from pathlib import Path
          import base64,tarfile,io,shutil,subprocess
          archive=base64.b64decode(Path('role-update-payload.b64').read_text().strip())
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as t:
              for member in t.getmembers():
                  if '/' in member.name.strip('./') or '..' in member.name:
                      raise RuntimeError('Unexpected payload member')
              t.extractall('.')
          shutil.copyfile('role_policy.py','app/role_policy.py')
          for script in ('apply_role_patch.py','patch_ui.py','finalize_patch.py'):
              subprocess.run(['python',script],check=True)
          PY
          python -m compileall -q app
          node --check app/static/app.js
          python - <<'PY'
          from app.catalog import ROLES,DEMO_USERS
          from app.role_policy import ROLE_DOCS,ROLE_WORKSPACES
          assert len(ROLES)==len(DEMO_USERS)==len(ROLE_DOCS)==len(ROLE_WORKSPACES)==29
          assert ROLE_DOCS['admin']==set()
          assert 'lean-business-case' not in ROLE_DOCS['qa']
          print('All 29 role profiles and key data permissions verified')
          PY
          tar -cJf ternstone-runtime.tar.xz app seed requirements.txt
          git rm -f role-update-payload.b64 .github/workflows/valueops-role-audit.yml
          git add ternstone-runtime.tar.xz
          git config user.name 'ValueOps Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Scope 29 role workspaces, contract access, audit and platform authority'
          git push origin HEAD:ternstone-valueops-deploy
