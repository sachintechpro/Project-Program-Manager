name: Release ValueOps commercial insurance scenario contracts
on:
  push:
    branches: [ternstone-valueops-deploy]
permissions:
  contents: write
jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply linked reference catalog and role controls
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf ternstone-runtime.tar.xz
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64,io,tarfile
          raw=base64.b64decode(Path('valueops-insurance-release.b64').read_text().strip(),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as t:
              members=t.getmembers()
              for m in members:
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or not m.isfile():
                      raise RuntimeError('Unsafe release path '+m.name)
                  if not (str(p) in {'app/main.py','app/catalog.py','app/enterprise_data.py','app/control_policy.py','app/static/app.js'} or str(p).startswith('seed/data/')):
                      raise RuntimeError('Release contains unexpected file '+m.name)
              t.extractall('.')
          print('Applied',len(members),'reviewed release files')
          PY
          python -m compileall -q app
          node --check app/static/app.js
          python -m pip install -q -r requirements.txt
          DEMO_MODE=true SECRET_KEY=insurance-ci-test DATABASE_URL=sqlite:///./ci_insurance.db python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          from app.control_policy import BY_ROLE
          from app.enterprise_data import table,schemas
          assert len(BY_ROLE)==29
          assert len([x for x in schemas() if not x.startswith('_')])==16
          assert len(table('test_cases'))==90
          with TestClient(app) as client:
              assert client.get('/health').json()['status']=='ok'
              l=client.post('/api/login',json={'role':'program_manager'})
              assert l.status_code==200,l.text
              h={'X-CSRF-Token':l.json()['csrf']}
              stream=next(x for x in client.get('/api/streams').json() if x['key']=='underwriting')
              req={'stream_id':stream['id'],'template':'wc-submission','title':'Workers Compensation completeness modernization','lob':'Workers Compensation','budget':420000,'annual_benefit':920000,'baseline':11.8,'target':6.2,'unit':'days','volume':'4,200 submissions / month','workflow':'Broker intake to quote','rules':'Underwriter retains authority','risk':'Missing payroll','dependencies':'Policy admin'}
              new=client.post('/api/initiatives',headers=h,json=req)
              assert new.status_code==200,new.text
              id=new.json()['id']
              ref=client.get(f'/api/initiatives/{id}/reference').json()
              assert len(ref['tables']['test_cases'])==10
              assert sum(int(x['planned_cost_usd']) for x in ref['tables']['cost_estimates'])==420000
              assert ref['tables']['metrics'][0]['actual_status']=='unmeasured'
              review=client.get(f'/api/initiatives/{id}/control-reviews').json()
              assert review['stage']=='portfolio'
              assert len(review['controls'])>=3
              client.post('/api/login',json={'role':'qa'})
              qa=client.get(f'/api/initiatives/{id}/reference').json()
              assert 'cost_estimates' not in qa['tables']
              assert client.get('/api/audit/verify').json()['valid']
          print('Release smoke passed: role controls, end-to-end seed access, finances and audit')
          PY
          rm -f ci_insurance.db
          tar -cJf ternstone-runtime.tar.xz app seed requirements.txt
          git rm -f valueops-insurance-release.b64 .github/workflows/valueops-insurance-release.yml
          git add ternstone-runtime.tar.xz
          git config user.name 'ValueOps Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add 29 role decisions and 16 validated insurance scenario reference tables'
          git push origin HEAD:ternstone-valueops-deploy
